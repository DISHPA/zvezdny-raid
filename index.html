    arcTxt(fmt(cst), bxx + bwd / 2, byy + bht / 2, u * 11.5, afford ? '#04240f' : '#5f5583', 'center', { shadow: afford ? pxs * 0.5 : 0, shadowCol: '#0a3a1c', maxW: bwd - u * 8 });
    c._btn = { x: bxx, y: byy, w: bwd, h: bht };
  }
}

function effectText(k, lv) {
  const u = UP[k];
  const cur = {
    dmg: () => '+' + fmt(2.6 * 100) + '% урона/ур',
    spd: () => '+' + (5.5).toFixed(1) + '% скорости',
    crit: () => '+' + (1.4).toFixed(1) + '% шанс крита',
    cdmg: () => '+' + (28) + '% урона крита',
    tap: () => '+' + (42) + '% силы тапа',
    gold: () => '+' + (13) + '% золота',
    hp: () => '+' + 32 + ' HP',
    regen: () => '+' + (0.9).toFixed(1) + ' HP/сек',
    armor: () => '+' + (2.2).toFixed(1) + '% брони',
    a1: () => '+' + (1.8).toFixed(1) + ' урона дрона',
    a2: () => '+' + 9 + ' урона турели',
    a3: () => '+' + 62 + ' урона лазера'
  }[k];
  return cur ? cur() : '';
}

function drawAchTab() {
  const u = U;
  const C = layout.content;
  const pxs = Math.max(2, u * 2.2);

  arcTxt('ОТКРЫТО ' + done + ' / ' + ACH.length, C.x, C.y + u * 4, u * 11, '#7cf3ff', 'left', { shadow: pxs * 0.5 });

  const top = C.y + u * 16;
  const gap = u * 5;
  const colW = (C.w - u * 8) / 2;
  const rowsN = Math.ceil(ACH.length / 2);
  const rowH = Math.min(u * 40, (C.y + C.h - top - gap * rowsN) / rowsN);
  layout.achRows = [];

  ACH.forEach((a, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const x = C.x + col * (colW + u * 8);

    const got = !!G.ach[a.id];

    P(mx - bs, my - bs, bs * 2, bs * 2, got ? '#1d4a33' : '#1a1229');

      /* пиксельная галочка */
      const q = Math.max(1.6, u * 1.7);
      P(mx - q * 3, my, q, q, '#3ddc84');
      P(mx - q * 2, my + q, q, q, '#3ddc84');
      P(mx - q, my + q * 2, q, q, '#3ddc84');
      P(mx, my + q, q * 2, q, '#3ddc84');
      P(mx + q * 2, my - q, q * 2, q, '#3ddc84');
      P(mx + q * 2, my, q, q, '#3ddc84');
    } else {
      arcTxt('?', mx, my + u * 0.5, u * 13, '#3d2f66', 'center', { shadow: 0 });
    }

    arcTxt(a.name, x + u * 37, y + rowH * 0.34, u * 10.5, got ? '#d7ffe8' : '#8f86b8', 'left', { shadow: pxs * 0.4, maxW: colW - u * 44 });
    arcTxt(a.d, x + u * 37, y + rowH * 0.66, u * 9, got ? '#7fd6a4' : '#5f5583', 'left', { shadow: pxs * 0.3, maxW: colW - u * 44 });
    layout.achRows.push({ x, y, w: colW, h: rowH });

function drawSkillCards() {
  const u = U;
  const now = performance.now() / 1000;
  const pxs = Math.max(2, u * 2.2);
  const cname = (id) => {
    const s = CONTENT.skills && CONTENT.skills[id];
    if (Array.isArray(s) && s[0] && s[0].length < 26) return s[0].toUpperCase();
    return { strike: 'МОЩНЫЙ УДАР', tornado: 'ВИХРЬ', meteor: 'МЕТЕОР', heal: 'ЛЕЧЕНИЕ' }[id];
  };
  const cdesc = (id) => {
    const s = CONTENT.skills && CONTENT.skills[id];
    if (Array.isArray(s) && s[1] && s[1].length > 4) return s[1];
    return {
      strike: 'Мгновенный удар по цели ×3',
      tornado: 'Виражи урона по всем врагам',
      meteor: 'Обрушивает небо на противника',
      heal: 'Восстанавливает запас прочности'
    }[id] || '';
  };

  for (const c of layout.skillCards) {
    const id = c.id;
    const def = SKILLS[id];
    const lv = G.sk[id] || 0;
    const locked = G.zone < def.zoneReq;
    const maxed = lv >= 5;
    const cst = skillCost(id);
    const afford = !locked && !maxed && G.gold >= cst;

    arcPanel(c.x + pxs * 2, c.y + pxs * 2, c.w, c.h, '#08040f', null, u * 7);
    arcPanel(c.x, c.y, c.w, c.h, locked ? '#120d1e' : '#170f28',
      locked ? '#2a2044' : afford ? '#3ddc84' : def.col, u * 7);
    if (!locked) P(c.x + pxs, c.y + pxs, pxs * 1.6, c.h - pxs * 2, def.col);

    const ir = c.h * 0.24;
    const icx = c.x + u * 30, icy = c.y + c.h / 2;
    P(icx - ir * 1.15, icy - ir * 1.15, ir * 2.3, ir * 2.3, locked ? '#1a1229' : '#2a1b4a');
    ctx.save();
    ctx.globalAlpha = locked ? 0.3 : 1;
    drawSkillIcon(id, icx, icy, ir, def.col);
    ctx.restore();

    const nx = c.x + u * 58;
    arcTxt(cname(id), nx, c.y + c.h * 0.32, u * 12.5, locked ? '#5f5583' : '#f0e8ff', 'left', { shadow: pxs * 0.5, maxW: c.w - u * 150 });
    const sub = locked ? ('ОТКРОЕТСЯ В ЗОНЕ ' + def.zoneReq)
      : ('LV ' + lv + '/5' + (lv > 0 ? '  •  УРОН ×' + (def.dmgMul * (1 + lv * 0.5)).toFixed(1) : ''));
    arcTxt(sub, nx, c.y + c.h * 0.56, u * 9.5, locked ? '#4a3f6b' : '#ffd166', 'left', { shadow: pxs * 0.4, maxW: c.w - u * 150 });
    const d = cdesc(id);
    if (d) arcTxt(d, nx, c.y + c.h * 0.79, u * 9, locked ? '#3d2f66' : def.col, 'left', { shadow: pxs * 0.35, maxW: c.w - u * 150 });

    const bwd = u * 80, bht = Math.min(u * 32, c.h * 0.46);
    const bxx = c.x + c.w - bwd - u * 10;
    const byy = c.y + c.h / 2 - bht / 2;
    if (afford) {
      arcPanel(bxx + pxs * 1.5, byy + pxs * 1.5, bwd, bht, '#0a3018', null, u * 5);
      arcPanel(bxx, byy, bwd, bht, '#3ddc84', '#b6ffd0', u * 5);
    } else {
      arcPanel(bxx, byy, bwd, bht, '#1a1229', '#2a2044', u * 5);
    }
    const label = maxed ? 'МАКС' : locked ? 'ЗАКРЫТО' : fmt(cst);
    arcTxt(label, bxx + bwd / 2, byy + bht / 2, u * (maxed || locked ? 9 : 11.5),
      maxed || locked ? '#5f5583' : afford ? '#04240f' : '#5f5583', 'center',
      { shadow: afford ? pxs * 0.5 : 0, shadowCol: '#0a3a1c', maxW: bwd - u * 8 });
    c._btn = { x: bxx, y: byy, w: bwd, h: bht };
  }
}

function skillCost(id) {
  const lv = G.sk[id] || 0;
  return Math.ceil(SKILLS[id].price * Math.pow(2.6, lv));
}

  /* ---- АВТО-ПОКУПКА ---- */
  const ab = layout.buyAll;
  const on = G.auto.buy;
  arcPanel(ab.x, ab.y, ab.w, ab.h, on ? '#14291f' : '#140e22', on ? '#3ddc84' : '#2a2044', u * 6);
  arcTxt('АВТО-ПОКУПКА', ab.x + u * 16, ab.y + ab.h / 2, u * 11, on ? '#9dffc4' : '#6f6592', 'left', { shadow: pxs * 0.4 });

  P(tx, ty, tw, th, on ? '#0e3a22' : '#1a1229');
  const kw = tw * 0.44;
  P(on ? tx + tw - kw - pxs : tx + pxs, ty + pxs, kw, th - pxs * 2, on ? '#9dffc4' : '#6f6592');

  /* ---- СКИНЫ ---- */

  for (const sc of layout.skinCards) {

    const sel = G.skin === sc.skin;
    const def = SKIN_COLORS.find(s => s.id === sc.skin);

    arcPanel(sc.x + pxs * 2, sc.y + pxs * 2, sc.w, sc.h, '#08040f', null, u * 6);
    arcPanel(sc.x, sc.y, sc.w, sc.h, sel ? '#241a38' : '#150e24',

    /* превью героя */
    ctx.save();
    ctx.translate(sc.x + sc.w / 2, sc.y + sc.h * 0.64);
    const hv = (sc.h * 0.68) / (worldH * 0.42);
    ctx.scale(hv, hv);

      /* метка выбора */

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(sc.x + pxs, sc.y + pxs, sc.w - pxs * 2, sc.h - pxs * 2);
    }
  }

  /* ---- СТАТИСТИКА ---- */
  const lastSkin = layout.skinCards[layout.skinCards.length - 1];
  const sy = (lastSkin ? lastSkin.y + lastSkin.h : C.y + u * 396) + u * 14;
  const shh = C.y + C.h - sy - u * 4;
  if (shh > u * 62) {
    const sh = Math.min(shh, u * 104);
    arcPanel(C.x, sy, C.w, sh, '#120a1e', '#3d2f66', u * 7);
    arcTxt('СТАТИСТИКА', C.x + u * 16, sy + u * 18, u * 10, '#8f86b8', 'left', { shadow: pxs * 0.4 });
    P(C.x + u * 14, sy + u * 29, C.w - u * 28, pxs, '#3d2f66');

    const mins = Math.floor((G.playTime || 0) / 60);
    const rows = [
      ['УБИЙСТВ', fmt(G.kills || 0)],
      ['БОССОВ', fmt(G.stats.bosses || 0)],
      ['ЗОЛОТА ВСЕГО', fmt(G.totalGold || 0)],
      ['РЕКОРД ЗОНЫ', 'Z' + ((G.best && G.best.zone) || 1)],
      ['ПЕРЕРОЖДЕНИЙ', fmt(G.prestiges || 0)],
      ['В ИГРЕ', mins > 59 ? (mins / 60 | 0) + ' Ч' : mins + ' МИН']
    ];
    const colW = C.w / 3;
    const rowGap = Math.min(u * 34, (sh - u * 50) / 2);
    rows.forEach((r, i) => {
      const cx2 = C.x + (i % 3) * colW + u * 16;
      const cy2 = sy + u * 42 + Math.floor(i / 3) * rowGap;
      arcTxt(r[0], cx2, cy2, u * 7.8, '#5f5583', 'left', { shadow: pxs * 0.3 });
      arcTxt(r[1], cx2, cy2 + u * 13, u * 11, '#cfc4ff', 'left', { shadow: pxs * 0.45 });
    });
  }
}

function skinName(id) {

  return map[id] || id;
}

function localXY(e) {
  const r = cv.getBoundingClientRect();

    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: cx - r.left, y: cy - r.top };
}

function inRect(p, r) {

function inDisc(p, d) {

        const tt = t / 0.55;
        const my = lerp(-u * 80, f.y - u * 20, tt);
        const mx = lerp(f.x + u * 180, f.x, tt);
        glowDisc(mx, my, u * 16, f.col, u * 30);
        ctx.strokeStyle = hexA(f.col, 0.5); ctx.lineWidth = u * 10;
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + u * 90, my - u * 80); ctx.stroke();
      }
    } else if (f.type === 'heal') {
      for (let i = 0; i < 5; i++) {
        const yy = f.y + u * 30 - t * u * 90 - i * u * 14;
        ctx.fillStyle = hexA(f.col, 0.9 * (1 - t));
        disc(f.x + Math.sin(t * 8 + i) * u * 14, yy, u * 4 * (1 - t * 0.5), hexA(f.col, 0.9 * (1 - t)));
      }
    }
    ctx.globalAlpha = 1;
  }
}

function drawAchToast() {
  if (!achMsg) return;
  const u = U;
  const t = clamp(achT / 2.6, 0, 1);
  const inA = clamp((1 - t) * 6, 0, 1);
  const outA = clamp(t * 6, 0, 1);
  const a = Math.min(inA, outA);
  const w = Math.min(W * 0.78, u * 360);
  const h = u * 54;
  const x = (W - w) / 2;
  const y = u * 86 - (1 - a) * u * 30;

  ctx.globalAlpha = a;
  ctx.save();
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = u * 20;
  rr(x, y, w, h, u * 14, 'rgba(28,20,10,0.96)');
  ctx.restore();
  ctx.strokeStyle = hexA('#ffd166', 0.8); ctx.lineWidth = Math.max(1.4, u * 1.6);
  rr(x, y, w, h, u * 14, null); ctx.stroke();

  statIcon('cdmg', x + u * 28, y + h / 2, u * 15, '#ffd166');
  txt('ДОСТИЖЕНИЕ', x + u * 52, y + u * 18, u * 9, hexA('#ffd166', 0.85), 'left', '800');
  txt(achMsg.name || '', x + u * 52, y + u * 33, u * 13, '#fff8e0', 'left', '900', w - u * 66);
  txt(achMsg.d || '', x + u * 52, y + u * 45, u * 8.5, 'rgba(255,240,200,0.6)', 'left', '600', w - u * 66);
  ctx.globalAlpha = 1;
}

/* ============================== MAIN RENDER ============================== */
const camShake = () => ({ x: rand(-1, 1) * G2.shake, y: rand(-1, 1) * G2.shake });

/* ============================== FX LAYERS ============================== */
function groundShadow(x, w, a) {
  const g = ctx.createRadialGradient(x, groundY + U * 3, 0, x, groundY + U * 3, w);
  g.addColorStop(0, 'rgba(0,0,0,' + a + ')');
  g.addColorStop(0.65, 'rgba(0,0,0,' + a * 0.45 + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.translate(x, groundY + U * 3);
  ctx.scale(1, 0.20);
  ctx.beginPath(); ctx.arc(0, 0, w, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}

function heroAura(t) {
  const zd = zoneDef(G.zone);
  const pulse = 0.6 + 0.4 * Math.sin(t * 2.2);
  const g = ctx.createRadialGradient(heroX, groundY - U * 46, U * 6, heroX, groundY - U * 46, U * 92);
  g.addColorStop(0, hexA(zd.accent, 0.16 * pulse));
  g.addColorStop(0.45, hexA(zd.accent, 0.06 * pulse));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(heroX - U * 100, groundY - U * 150, U * 200, U * 200);
  /* floor ring */
  ctx.save();
  ctx.translate(heroX, groundY + U * 2);
  ctx.scale(1, 0.2);
  ctx.strokeStyle = hexA(zd.accent, 0.22 + 0.14 * pulse);
  ctx.lineWidth = Math.max(1, U * 2.2);
  ctx.beginPath(); ctx.arc(0, 0, U * 52, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.52, Math.min(W, H) * 0.34, W / 2, H * 0.52, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.46)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawComboBloom(t) {
  if (G2.combo < 5) return;
  const k = clamp((G2.combo - 5) / 45, 0, 1);
  const a = k * clamp(G2.comboT / 1.4, 0, 1);
  const col = G2.combo >= 20 ? '#ff8af0' : '#7cf3ff';
  const g = ctx.createRadialGradient(heroX, groundY - U * 50, U * 20, heroX, groundY - U * 50, U * (110 + k * 70));
  g.addColorStop(0, hexA(col, 0.12 * a));
  g.addColorStop(0.6, hexA(col, 0.05 * a));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawUltFx(t) {
  if (G2.ultFx <= 0) return;
  const p = 1 - G2.ultFx;          /* 0..1 progress */
  const a = G2.ultFx;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* expanding shockwave rings */
  for (let i = 0; i < 3; i++) {
    const r = U * (60 + p * 420 + i * 90);
    ctx.strokeStyle = hexA(i % 2 ? '#ff6ad5' : '#7cf3ff', a * (0.5 - i * 0.12));
    ctx.lineWidth = Math.max(1.5, U * (7 - i * 1.8) * a);
    ctx.beginPath(); ctx.arc(heroX, groundY - U * 46, r, 0, TAU); ctx.stroke();
  }
  /* vertical beam */
  const bw2 = U * 26 * a;
  const bg = ctx.createLinearGradient(heroX - bw2, 0, heroX + bw2, 0);
  bg.addColorStop(0, hexA('#ff6ad5', 0));
  bg.addColorStop(0.5, hexA('#ffffff', 0.5 * a));
  bg.addColorStop(1, hexA('#ff6ad5', 0));
  ctx.fillStyle = bg;
  ctx.fillRect(heroX - bw2, 0, bw2 * 2, groundY + U * 10);
  ctx.restore();
}

function render() {
  const u = U;
  const t = performance.now() / 1000;

  if (state === 'menu') {
    for (let i = stars.length - 1; i >= 0; i--) { stars[i].ph += 0.02; }
    drawSky(0);
    drawFar(0);
    drawGround(0);
    drawMenu();
    drawParticles();
    if (offlineReport) drawOffline();
    return;
  }

  /* camera shake */
  const sh = camShake();
  ctx.save();
  ctx.translate(sh.x, sh.y);

  drawSky(G2.zoneIn);
  drawFar(G2.zoneIn);
  drawGround(G2.zoneIn);

  /* atmospheric haze between ground and actors */
  const hz = ctx.createLinearGradient(0, groundY - worldH * 0.30, 0, groundY + U * 26);
  hz.addColorStop(0, hexA(zoneDef(G.zone).accent, 0));
  hz.addColorStop(0.75, hexA(zoneDef(G.zone).accent, 0.055));
  hz.addColorStop(1, hexA(zoneDef(G.zone).accent, 0));
  ctx.fillStyle = hz;
  ctx.fillRect(0, groundY - worldH * 0.30, W, worldH * 0.30 + U * 26);

  /* hero aura + shadow */
  heroAura(t);
  groundShadow(heroX, U * 54, 0.42);

  /* hero */
  const heroSt = G2.dead > 0 ? 'dead' : G2.atkAnim > 0.3 ? 'attack' : 'idle';
  const heroPh = t;
  if (G2.dead > 0) {
    ctx.save();
    ctx.globalAlpha = 1 - G2.dead * 0.7;
    drawHero(heroX, groundY, heroPh, 'idle');
    ctx.restore();
  } else {
    drawHero(heroX, groundY, heroPh, heroSt);
  }

  /* monster */
  if (G2.monster) {
    const m = G2.monster;
    const lunge = m.lunge > 0 ? Math.sin(m.lunge * Math.PI) * U * 18 : 0;
    groundShadow(m.x - lunge, m.mh * 0.55, m.boss ? 0.5 : 0.36);
    drawMonster(m, m.x - lunge, groundY, m.mh);
  }

  /* ultimate shockwave */
  drawUltFx(t);
  drawComboBloom(t);

  /* typing: hero run animation trail */
  if (G2.atkAnim > 0) {
    ctx.globalAlpha = G2.atkAnim * 0.35;
    ctx.strokeStyle = '#7cf3ff';
    ctx.lineWidth = u * 3;
    ctx.beginPath();
    ctx.arc(heroX, groundY - u * 46, u * 42, -0.9, 0.9);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  drawSkillFx();
  drawParticles();
  drawCoins();
  drawRings();
  drawFloats();

  ctx.restore();

  /* vignette over the world */
  drawVignette();

  /* hud */
  drawHUD();
  drawShopButton();

  /* boss intro banner */
  if (G2.bossIntro > 0 && G2.monster) {
    const a = clamp(G2.bossIntro, 0, 1);
    const m = G2.monster;
    ctx.save();
    ctx.globalAlpha = a;
    const by = H * 0.30;
    const bw = Math.min(W * 0.86, u * 460);
    rr(W / 2 - bw / 2, by - u * 20, bw, u * 58, u * 8, 'rgba(10,4,20,0.72)');
    ctx.strokeStyle = hexA('#ff4d5e', 0.8); ctx.lineWidth = Math.max(1.5, u * 2);
    rr(W / 2 - bw / 2, by - u * 20, bw, u * 58, u * 8, null); ctx.stroke();
    txt('БОСС', W / 2, by - u * 6, u * 10, hexA('#ff4d5e', 0.9), 'center', '800');
    txt(m.name || 'БОСС', W / 2, by + u * 11, u * 16, '#ffe0e4', 'center', '900', bw - u * 20);
    txt(FLAV.taunt[G.zone % FLAV.taunt.length], W / 2, by + u * 30, u * 9,
      hexA('#ffb3ba', 0.72 * a), 'center', '600', bw - u * 20);
    ctx.restore();
  }

  /* zone transition flash */
  if (G2.zoneIn > 0) {
    ctx.globalAlpha = clamp(G2.zoneIn, 0, 1) * 0.45;
    ctx.fillStyle = zoneDef(G.zone).accent;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    const zd = zoneDef(G.zone);
    const zname = (CONTENT.zones && CONTENT.zones[zoneKey()]) || zd.name;
    ctx.globalAlpha = clamp(G2.zoneIn, 0, 1);
    txt('ЗОНА ' + G.zone, W / 2, H * 0.42, u * 14, 'rgba(255,255,255,0.75)', 'center', '700');
    txt(zname, W / 2, H * 0.5, u * 30, '#fff', 'center', '900', W * 0.9);
    ctx.globalAlpha = 1;
  }

  /* hurt vignette */
  if (G2.hurt > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,0,40,0)');
    g.addColorStop(1, 'rgba(255,0,40,' + (G2.hurt * 0.42) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  drawAchToast();
  drawShop();

  /* offline report */
  if (offlineReport) drawOffline();
}

function drawOffline() {
  const u = U;
  const r = offlineReport;
  const pxs = pixSize();
  ctx.fillStyle = 'rgba(4,2,10,0.88)';
  ctx.fillRect(0, 0, W, H);

  const w = Math.min(W * 0.86, u * 330);
  const h = u * 236;
  const x = (W - w) / 2, y = (H - h) / 2;

  /* рамка как у игрового окна */
  arcPanel(x + pxs * 3, y + pxs * 3, w, h, '#07030e', null, u * 16);
  arcPanel(x, y, w, h, '#140a24', '#ffd166', u * 16);
  arcPanel(x + pxs * 2, y + pxs * 2, w - pxs * 4, h - pxs * 4, null, '#8f1f2c', u * 13);

  /* заголовок-плашка */
  const hw = w - u * 36, hh = u * 30;
  arcPanel(x + u * 18, y + u * 12, hw, hh, '#8f1f2c', '#ffd166', pxs * 2);
  arcTxt('ПОКА ВАС НЕ БЫЛО', x + w / 2, y + u * 12 + hh / 2, u * 14, '#fff2c0');

  const mins = Math.floor(r.sec / 60);
  arcTxt('ОТСУТСТВОВАЛИ: ' + (mins >= 60 ? Math.floor(mins / 60) + ' Ч ' + (mins % 60) + ' М' : mins + ' МИН'),
    x + w / 2, y + u * 56, u * 10, '#8f7fb8');

  /* монета — пиксельный ромб, как в HUD */
  const cy = y + u * 112;
  const cs = u * 15;
  ctx.save();
  ctx.translate(x + w / 2, cy);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#3a2400';
  ctx.fillRect(-cs / 2 - pxs, -cs / 2 - pxs, cs + pxs * 2, cs + pxs * 2);
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(-cs / 2, -cs / 2, cs, cs);
  ctx.restore();
  arcTxt('$', x + w / 2, cy, u * 16, '#5c3d00', 'center', { shadow: 0 });

  arcTxt('+' + fmt(r.gold), x + w / 2, y + u * 152, u * 22, '#ffe9a8');

  const bw = w - u * 56, bh = u * 40;
  const bx = x + u * 28, by = y + h - bh - u * 20;
  layout.offlineBtn = { x: bx, y: by, w: bw, h: bh };
  arcPanel(bx + pxs * 1.5, by + pxs * 1.5, bw, bh, '#0a3018', null, u * 5);
  arcPanel(bx, by, bw, bh, '#3ddc84', '#b6ffd0', u * 5);
  arcTxt('ЗАБРАТЬ', x + w / 2, by + bh / 2, u * 14, '#08301a');
}

/* ============================== LOOP ============================== */
let lastT = performance.now();
let saveT = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  tipT -= dt;
  update(dt);

  saveT += dt;
  if (saveT > 8) { saveT = 0; save(); }

  render();
  requestAnimationFrame(frame);
}

/* ============================== OFFLINE ============================== */
function checkOffline() {
  const away = (Date.now() - (G.lastSeen || Date.now())) / 1000;
  if (away < 60) return;
  const capped = Math.min(away, 8 * 3600);
  const st = stats();
  const gold = Math.floor(st.dps * capped * 0.28 * st.goldM * 0.35);
  if (gold > 0 && G.kills > 0) {
    offlineReport = { sec: capped, gold };
  }
}

/* ============================== ACH SYNC ============================== */
function syncAch() {
  /* achievements tied to content names */
  if (CONTENT.ach && CONTENT.ach.length) {
    for (let i = 0; i < ACH.length && i < CONTENT.ach.length; i++) {
      const c = CONTENT.ach[i];
      if (c && c.name) { ACH[i].name = c.name; ACH[i].d = c.d || ACH[i].d; }
    }
  }
}

/* ============================== BOOT ============================== */
function initStars() {
  stars = [];
  const n = Math.round(Math.min(180, W * 0.22));
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() < 0.86 ? 1 : 2,
      a: rand(0.25, 0.95),
      sp: rand(0.4, 2.4),
      ph: rand(0, TAU),
      c: Math.random() < 0.2 ? '#aee0ff' : '#ffffff'
    });
  }
}

function boot() {
  resize();
  window.addEventListener('resize', () => { resize(); initStars(); layoutShop(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { resize(); initStars(); layoutShop(); }, 220));

  initStars();
  load();
  Sfx.on = G.sound;
  syncAch();
  layoutShop();

  const st = stats();
  G2.maxHP = st.maxHP;
  G2.hp = st.maxHP;

  checkOffline();

  /* telegram — SDK грузится async, поэтому подхватываем когда появится */
  const tgInit = () => {
    if (!tgSync()) return false;
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor('#08040f');
      if (TG.setBackgroundColor) TG.setBackgroundColor('#08040f');
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      if (TG.enableClosingConfirmation) TG.enableClosingConfirmation();
    } catch (e) {}
    return true;
  };
  if (!tgInit()) {
    /* ждём SDK максимум 4 с, игра при этом уже работает */
    let n = 0;
    const tw = setInterval(() => {
      if (tgInit() || ++n > 20) clearInterval(tw);
    }, 200);
  }

  state = 'menu';

  if (location.search.indexOf('dbg') >= 0) {
    window.__G = G; window.__G2 = G2; window.__st = stats;
    window.__lay = () => layout; window.__tab = () => tab;
    window.__dbg = () => ({ state, shopOpen, tab, shopT });
    window.__shopRect = shopButtonRect;
    window.__set = (k, v) => { G[k] = v; };
    window.__doom = () => Doom;
    window.__offline = (sec) => {
      G.lastSeen = Date.now() - sec * 1000;
      checkOffline();
      return offlineReport;
    };
  }

  cv.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
  cv.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  cv.addEventListener('mousedown', onDown);

  requestAnimationFrame(frame);
}

boot();

})();
</script>

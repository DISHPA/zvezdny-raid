const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const randi = (a, b) => Math.floor(rand(a, b + 1));

const TAU = Math.PI * 2;

function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return String(Math.floor(n));
  const names = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc'];
  let i = 0;
  while (n >= 1000 && i < names.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + names[i];
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function mixHex(h1, h2, t) {
  const p = (h) => { const v = h.replace('#', ''); return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)]; };
  const a = p(h1), b = p(h2);
  const c = a.map((v, i) => Math.round(lerp(v, b[i], t)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

function rr(x, y, w, h, r, fill) {
  const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function disc(cx, cy, r, fill) {
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function txt(s, x, y, size, color, align, weight, maxW) {
  ctx.font = (weight || '700') + ' ' + Math.round(size) + 'px -apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  if (maxW) ctx.fillText(s, x, y, maxW); else ctx.fillText(s, x, y);
}
function glowDisc(cx, cy, r, col, blur) {
  ctx.save();
  ctx.shadowColor = col;
  ctx.shadowBlur = blur || 18;
  disc(cx, cy, r, col);
  ctx.restore();
}

/* seeded pseudo-random for stable procedural art */
function seeded(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647;
}

/* ============================== PIXEL-ART CORE ==============================
   Весь новый арт рисуется «пикселями»: один арт-пиксель = PX CSS-пикселей.
   Это даёт ту самую крупную блочность аркадного автомата и заодно
   автоматически масштабируется вместе с U. */
let PX = 2;
function pixSize() { return Math.max(1.6, U * 2.3); }

/* блок из «пиксельных» координат */
function P(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x, y, w, h);
}

/* спрайт из строк: rows — массив строк, palette — {символ: цвет}
   ox, oy — левый верхний угол, cw/ch — размер одного пикселя */
function spr(rows, palette, ox, oy, cw, ch) {
  ch = ch || cw;
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    let x = 0;
    while (x < row.length) {
      const c = row[x];
      let run = 1;
      while (x + run < row.length && row[x + run] === c) run++;
      const col = palette[c];
      if (col) P(ox + x * cw, oy + y * ch, run * cw, ch, col);
      x += run;
    }
  }
}

/* Крупная «аркадная» надпись: моноширинный жирный шрифт + тень-пиксель. */
function arcTxt(s, x, y, size, col, align, opts) {
  opts = opts || {};
  ctx.save();
  ctx.font = '900 ' + Math.round(size) + 'px ui-monospace,"Consolas","Courier New",monospace';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  const sh = opts.shadow === undefined ? Math.max(1, size * 0.11) : opts.shadow;
  if (sh > 0) {
    ctx.fillStyle = opts.shadowCol || 'rgba(0,0,0,0.72)';
    if (opts.maxW) ctx.fillText(s, x + sh, y + sh, opts.maxW);
    else ctx.fillText(s, x + sh, y + sh);
  }
  ctx.fillStyle = col;
  if (opts.maxW) ctx.fillText(s, x, y, opts.maxW);
  else ctx.fillText(s, x, y);
  ctx.restore();
}

/* Аркадная панель: тёмная плашка, светлая рамка в 1 пиксель,
   скошенные углы — как в меню 90-х. */
function arcPanel(x, y, w, h, fill, border, cut) {
  cut = cut === undefined ? Math.max(2, U * 3) : cut;
  ctx.beginPath();
  ctx.moveTo(x + cut, y);
  ctx.lineTo(x + w - cut, y);
  ctx.lineTo(x + w, y + cut);
  ctx.lineTo(x + w, y + h - cut);
  ctx.lineTo(x + w - cut, y + h);
  ctx.lineTo(x + cut, y + h);
  ctx.lineTo(x, y + h - cut);
  ctx.lineTo(x, y + cut);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (border) {
    ctx.strokeStyle = border;
    ctx.lineWidth = Math.max(1, U * 1.6);
    ctx.stroke();
  }
}

/* Горизонтальная полоса-градиент из дискретных ступеней (дизеринг эпохи SNES) */
function ditherBand(y0, y1, cols, x0, x1) {
  x0 = x0 || 0; x1 = x1 === undefined ? W : x1;
  const n = cols.length;
  const bh = (y1 - y0) / n;
  for (let i = 0; i < n; i++) {
    P(x0, y0 + i * bh, x1 - x0, bh + 1, cols[i]);
    /* шахматный дизеринг на стыке со следующей ступенью */
    if (i < n - 1) {
      const step = Math.max(2, U * 2.6);
      ctx.fillStyle = cols[i + 1];
      for (let gx = x0; gx < x1; gx += step * 2) {
        ctx.fillRect(gx + (i % 2 ? step : 0), y0 + (i + 1) * bh - step * 0.5, step, step * 0.5);
      }
    }
  }
}

function dailyReady() { return (Date.now() - (G.daily.last || 0)) >= DAY * 0.92; }
function dailyIdx() { return Math.min(6, (G.daily.streak || 0) % 7); }
function claimDaily() {
  if (!dailyReady()) return null;
  const d = DAILY[dailyIdx()];
  if (d.gold) { const g = d.gold + G.zone * 120; G.gold += g; G.totalGold += g; }
  if (d.gems) G.gems += d.gems;
  G.daily.last = Date.now();
  G.daily.streak = (G.daily.streak || 0) + 1;
  Sfx.win(); HAP('win');
  save();
  return d;
}

function cost(key) {
  const d = UP[key];
  const lv = G.up[key] || 0;
  return Math.ceil(d.base * Math.pow(d.growth, lv));
}

function achCount() { let n = 0; for (const k in G.ach) if (G.ach[k]) n++; return n; }

function stats() {
  const u = G.up;
  const soulM = 1 + G.souls * 0.12 + achCount() * 0.02;
  const skinB = G.skin !== 'base' ? 1.06 : 1;

  let dmg = (1 + u.dmg * 2.6) * soulM * skinB;
  const aps = 0.85 * (1 + u.spd * 0.055);
  let crit = Math.min(0.80, u.crit * 0.014);
  const cdmg = 2.0 + u.cdmg * 0.28;
  const tapM = (1 + u.tap * 0.42) * (1 + relicBonus('tap'));
  let goldM = (1 + u.gold * 0.13) * soulM;
  let maxHP = (60 + u.hp * 32) * (1 + G.souls * 0.06);
  const regen = u.regen * 0.9 + maxHP * 0.001;
  const armor = Math.min(0.75, u.armor * 0.022);
  let ally = u.a1 * 1.8 + u.a2 * 9 + u.a3 * 62;

  crit = Math.min(0.90, crit + relicBonus('crit'));
  goldM *= 1 + relicBonus('gold');
  maxHP *= 1 + relicBonus('hp');
  ally *= 1 + relicBonus('ally');

  const hit = dmg * (1 + crit * (cdmg - 1));
  let dps = hit * aps + ally;
  dps *= 1 + relicBonus('dps');

  return { dmg, aps, crit, cdmg, tapM, goldM, maxHP, regen, armor, ally, hit, dps, soulM };
}

function mHP(zone, stage, boss) {
  const base = 9 * Math.pow(1.66, zone - 1) * (1 + 0.085 * (stage - 1));
  return Math.max(4, Math.floor(base * (boss ? 7.5 : 1)));
}
function mGold(zone, stage, boss) {
  const base = 4 * Math.pow(1.46, zone - 1) * (1 + 0.058 * (stage - 1));
  return Math.max(1, Math.floor(base * (boss ? 13 : 1)));
}
function prestigeGain() {
  if (G.zone < 5) return 0;
  return Math.floor(Math.pow(G.zone - 4, 1.7) * 4 + G.stage * 0.35 + G.totalGold / 1e9);
}

/* ============================== SAVE ============================== */
function save() {
  try {
    G.lastSeen = Date.now();
    const d = {
      gold: G.gold, souls: G.souls, gems: G.gems, zone: G.zone, stage: G.stage,
      kills: G.kills, totalGold: G.totalGold, best: G.best, prestiges: G.prestiges,
      playTime: G.playTime, lastSeen: G.lastSeen, sound: G.sound, music: G.music,
      up: G.up, sk: G.sk, skin: G.skin, skinsOwned: G.skinsOwned, ach: G.ach,
      relics: G.relics, daily: G.daily,
      auto: G.auto, stats: G.stats
    };
    localStorage.setItem(KEY, JSON.stringify(d));
  } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    for (const k of ['gold','souls','gems','zone','stage','kills','totalGold','prestiges','playTime']) {
      if (typeof d[k] === 'number' && isFinite(d[k])) G[k] = d[k];
    }
    if (d.best && d.best.zone) G.best = d.best;
    if (d.up) for (const k of UPKEYS) if (typeof d.up[k] === 'number') G.up[k] = d.up[k];
    if (d.sk) for (const k in SKILLS) if (typeof d.sk[k] === 'number') G.sk[k] = d.sk[k];
    if (typeof d.skin === 'string') G.skin = d.skin;
    if (Array.isArray(d.skinsOwned) && d.skinsOwned.length) G.skinsOwned = d.skinsOwned;
    if (d.ach && typeof d.ach === 'object') G.ach = d.ach;
    if (d.relics && typeof d.relics === 'object') G.relics = d.relics;
    if (d.daily && typeof d.daily === 'object') G.daily = d.daily;
    if (d.auto) G.auto = d.auto;
    if (d.stats) Object.assign(G.stats, d.stats);
    if (typeof d.sound === 'boolean') G.sound = d.sound;
    G.lastSeen = d.lastSeen || Date.now();
    return true;
  } catch (e) { return false; }
}

/* общий «пиксель» для фона */
function bgPx() { return Math.max(2, U * 2.6); }

/* ============================== SKY ============================== */
let skyGrad = null, skyGradZone = -1;

function drawSky(zoneT) {
  const a = zoneDef(G.zone), b = zoneDef(G.zone + 1);
  const t = clamp(zoneT, 0, 1);
  const cols = a.sky.map((c, i) => mixHex(c, b.sky[i], t));
  const pc = bgPx();

  /* 6 ступеней закатного неба с дизерингом — как на SNES */
  ditherBand(0, groundY + pc, cols);

  /* крупные пиксельные звёзды (только в тёмных зонах) */
  const dark = G.zone >= 5;
  if (dark) {
    const rndS = seeded(G.zone * 131 + 5);
    for (let i = 0; i < 46; i++) {
      const sx = Math.round(rndS() * W / pc) * pc;
      const sy = Math.round(rndS() * groundY * 0.72 / pc) * pc;
      const big = rndS() > 0.86;
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(performance.now() / 900 + i));
      ctx.globalAlpha = tw * 0.9;
      P(sx, sy, pc, pc, '#ffffff');
      if (big) { P(sx - pc, sy, pc, pc, hexA('#cfe6ff', 0.6)); P(sx + pc, sy, pc, pc, hexA('#cfe6ff', 0.6)); }
      ctx.globalAlpha = 1;
    }
  }

  /* солнце/планета: ступенчатый диск, «утопленный» в дымку */
  const sunX = W * 0.74, sunY = groundY - worldH * 0.42;
  const sunR = Math.max(worldH * 0.20, U * 54);
  const sunCol = mixHex(a.sun, b.sun, t);
  const bands = 7;
  for (let i = 0; i < bands; i++) {
    const yy = sunY - sunR + (i / bands) * sunR * 2;
    const half = Math.sqrt(Math.max(0, sunR * sunR - (yy + sunR / bands - sunY) ** 2));
    const w = Math.max(pc, Math.round(half * 2 / pc) * pc);
    /* сверху ярче, снизу — темнее и с примесью закатного */
    const k = i / (bands - 1);
    const col = k < 0.45 ? sunCol : mixHex(sunCol, cols[3], (k - 0.45) * 1.35);
    P(Math.round(sunX - w / 2), Math.round(yy), w, Math.ceil(sunR * 2 / bands) + 1, col);
  }
  /* поперечные «полосы дымки» поверх солнца */
  ctx.globalAlpha = 0.55;
  for (let i = 2; i < 6; i++) {
    const yy = sunY - sunR * 0.35 + i * (sunR * 0.28);
    P(Math.round(sunX - sunR), Math.round(yy), Math.round(sunR * 2), Math.max(pc, pc * 0.8), cols[4]);
  }
  ctx.globalAlpha = 1;

  /* пиксельные облака: трёхъярусные «пуховки» из блоков */
  const rnd = seeded(G.zone * 71 + 11);
  const cloudCol = mixHex(a.cloud, b.cloud, t);
  const cloudLit = mixHex(cloudCol, a.sun, 0.38);
  const nClouds = 6;
  for (let i = 0; i < nClouds; i++) {
    const cw = Math.round((0.13 + rnd() * 0.15) * W / pc) * pc;
    const cx = Math.round((rnd() * 1.2 * W - W * 0.1) + Math.sin(performance.now() / 5200 + i) * pc * 4);
    const cy = Math.round((0.06 + rnd() * 0.42) * groundY / pc) * pc;
    const chh = Math.max(pc * 2, Math.round(cw * 0.10 / pc) * pc);
    /* нижний слой — самый широкий */
    P(cx, cy, cw, chh, cloudCol);
    P(cx + pc * 2, cy + chh, cw * 0.72, chh * 0.7, cloudCol);
    /* средний слой */
    P(cx + pc * 3, cy - chh, cw * 0.66, chh, cloudCol);
    /* верхний слой */
    P(cx + pc * 5, cy - chh * 2, cw * 0.34, chh, cloudLit);
    /* подсветка сверху */
    P(cx + pc * 3, cy - chh, cw * 0.66, Math.max(1, chh * 0.35), cloudLit);
    P(cx + pc * 6, cy - chh * 2, cw * 0.30, Math.max(1, chh * 0.4), cloudLit);
  }

  /* метеоры (пиксельные полосы) */
  for (const m of meteors) {
    if (m.life <= 0) continue;
    const px2 = Math.round(m.x / pc) * pc, py2 = Math.round(m.y / pc) * pc;
    for (let k = 0; k < 5; k++) {
      ctx.globalAlpha = m.life * (1 - k / 5) * 0.85;
      P(px2 + k * pc * 1.4, py2 - k * pc * 0.9, pc, pc, k === 0 ? '#ffffff' : cols[5]);
    }
    ctx.globalAlpha = 1;
  }

  skyGradZone = G.zone;
}

/* ============================== COSMODROME (FAR LAYER) ==============================
   Стартовый стол, фермы обслуживания, ракета бело-красная, флаг со звездой,
   растяжка «К ЗВЁЗДАМ!» — всё в пиксельной технике. */
function drawFar(zoneT) {
  const a = zoneDef(G.zone), b = zoneDef(G.zone + 1);
  const t = clamp(zoneT, 0, 1);
  const pc = bgPx();
  const farC = mixHex(a.far, b.far, t);
  const midC = mixHex(a.mid, b.mid, t);
  const accent = mixHex(a.accent, b.accent, t);
  const hz = groundY;
  const q = (x, y, w, h, col) => P(Math.round(x / pc) * pc, Math.round(y / pc) * pc,
    Math.max(pc, Math.round(w / pc) * pc), Math.max(pc, Math.round(h / pc) * pc), col);

  /* ---- дальний хребет: ступенчатые горы ---- */
  const rnd = seeded(G.zone * 977 + 13);
  const stepW = pc * 3;
  for (let x = -stepW; x < W + stepW; x += stepW) {
    const hh = (0.055 + rnd() * 0.10) * worldH;
    q(x, hz - hh, stepW + pc, hh + pc, farC);
  }
  /* вторая гряда ближе */
  const rnd1 = seeded(G.zone * 311 + 3);
  for (let x = -stepW; x < W + stepW; x += stepW * 1.6) {
    const hh = (0.03 + rnd1() * 0.075) * worldH;
    q(x, hz - hh, stepW * 1.8, hh + pc, midC);
  }

  /* ---- РАКЕТА (белая с красным) — главный элемент правой части ---- */
  const rkX = Math.round(W * 0.845 / pc) * pc;
  const rkW = pc * 7;
  const rkBase = hz + pc;
  const rkH = Math.round(worldH * 0.62 / pc) * pc;
  /* корпус */
  q(rkX, rkBase - rkH, rkW, rkH, '#eef1f7');
  /* тень справа */
  q(rkX + rkW - pc, rkBase - rkH, pc, rkH, '#b9bfd0');
  /* красная полоса */
  q(rkX, rkBase - rkH * 0.42, rkW, pc * 2, '#d8323e');
  q(rkX, rkBase - rkH * 0.14, rkW, pc, '#d8323e');
  /* нос — ступенчатый конус (красный наверху) */
  const nH = pc * 7;
  for (let i = 0; i < 6; i++) {
    const k = i / 5;                       /* 0 — у корпуса, 1 — верхушка */
    const w = Math.max(pc, rkW * (1 - k * 0.92));
    const segY = rkBase - rkH - (i + 1) * (nH / 6);
    q(rkX + (rkW - w) / 2, segY, w, nH / 6 + 0.6, k > 0.42 ? '#d8323e' : '#eef1f7');
  }
  q(rkX + rkW * 0.40, rkBase - rkH - nH - pc, rkW * 0.20, pc, '#ff4d5e');
  /* сопла + пламя */
  q(rkX + pc, rkBase - pc * 2, rkW - pc * 2, pc * 2, '#3a3448');
  const fl = Math.sin(performance.now() / 120) * 0.35 + 0.65;
  q(rkX + rkW * 0.22, rkBase, rkW * 0.56, pc * 2 * fl, '#ffd166');
  q(rkX + rkW * 0.34, rkBase, rkW * 0.32, pc * 3 * fl, '#ff7a3c');

  /* фермы обслуживания слева от ракеты */
  const trX = rkX - pc * 5;
  q(trX, rkBase - rkH * 0.92, pc, rkH * 0.92, midC);
  q(trX, rkBase - rkH * 0.92, pc * 5, pc, midC);
  q(trX, rkBase - rkH * 0.62, pc * 5, pc, midC);
  q(trX, rkBase - rkH * 0.30, pc * 5, pc, midC);
  for (let i = 0; i < 4; i++) {
    q(trX + pc * (1 + i), rkBase - rkH * 0.92 + (i + 0.5) * rkH * 0.20, pc, rkH * 0.20, hexA(midC, 0.7));
  }
  /* красный огонёк на макушке фермы */
  const blink = (Math.sin(performance.now() / 420) > 0.2);
  q(trX, rkBase - rkH * 0.92 - pc, pc, pc, blink ? '#ff4d5e' : '#5c1a24');

  /* ---- ЛЕВЫЙ СТАРТОВЫЙ СТОЛ (дальний, поменьше) ---- */
  const lx = Math.round(W * 0.055 / pc) * pc;
  const lh = worldH * 0.30;
  q(lx, hz - lh, pc * 2, lh, midC);
  q(lx + pc * 4, hz - lh, pc * 2, lh, midC);
  q(lx, hz - lh, pc * 6, pc, midC);
  q(lx, hz - lh * 0.55, pc * 6, pc, midC);
  q(lx + pc * 2, hz - lh * 0.86, pc * 2, lh * 0.86, hexA(midC, 0.85));

  /* ---- РАСТЯЖКА «К ЗВЁЗДАМ!» ---- */
  const bnW = Math.max(U * 128, W * 0.155);
  const bnH = Math.max(U * 26, worldH * 0.058);
  const bnX = Math.round(W * 0.115 / pc) * pc;
  const bnY = Math.round((hz - worldH * 0.44) / pc) * pc;
  /* столбы */
  q(bnX - pc, bnY - pc, pc, bnH + pc * 3, '#6a5a4a');
  q(bnX + bnW, bnY - pc, pc, bnH + pc * 3, '#6a5a4a');
  /* полотно с тенью */
  q(bnX, bnY, bnW, bnH, '#8f1f2c');
  q(bnX, bnY, bnW, pc, '#c8333f');
  q(bnX, bnY + bnH - pc, bnW, pc, '#5c121c');
  /* зубчатый низ — как у тряпичной растяжки */
  for (let i = 0; i < 8; i++) {
    const sw2 = bnW / 8;
    q(bnX + i * sw2, bnY + bnH, sw2 * 0.5, pc * 0.9, '#8f1f2c');
  }
  arcTxt('К ЗВЁЗДАМ!', bnX + bnW / 2, bnY + bnH / 2, Math.max(U * 11, bnH * 0.44), '#ffe9a8', 'center', { shadow: Math.max(1, bnH * 0.06), maxW: bnW - pc * 3 });

  /* ---- ФЛАГ СО ЗВЕЗДОЙ (правее центра) ---- */
  const fgX = Math.round(W * 0.66 / pc) * pc;
  const fgTop = Math.round((hz - worldH * 0.50) / pc) * pc;
  q(fgX, fgTop, pc, Math.round((hz - fgTop) / pc) * pc, '#4a4059');
  const fgW = pc * 9, fgH = pc * 6;
  const wave = Math.sin(performance.now() / 620) * pc * 0.5;
  q(fgX + pc, fgTop + wave, fgW, fgH, '#c8333f');
  q(fgX + pc, fgTop + wave, fgW, pc, '#ff4d5e');
  q(fgX + pc, fgTop + wave + fgH - pc, fgW, pc, '#8f1f2c');
  /* звезда из пикселей */
  const sx0 = fgX + pc * 1 + fgW * 0.35, sy0 = fgTop + wave + fgH * 0.42;
  q(sx0, sy0, pc * 3, pc, '#ffd166');
  q(sx0 + pc, sy0 - pc, pc, pc * 3, '#ffd166');
  q(sx0, sy0, pc, pc, '#fff3b0');
}

/* ============================== GROUND: БЕТОННЫЙ СТОЛ ============================== */
function drawGround(zoneT) {
  const a = zoneDef(G.zone), b = zoneDef(G.zone + 1);
  const t = clamp(zoneT, 0, 1);
  const pc = bgPx();
  const g1 = mixHex(a.gnd, b.gnd, t);
  const g2 = mixHex(a.gnd2, b.gnd2, t);
  const grass = mixHex(a.grass, b.grass, t);
  const q = (x, y, w, h, col) => P(Math.round(x / pc) * pc, Math.round(y / pc) * pc,
    Math.max(pc, Math.round(w / pc) * pc), Math.max(pc, Math.round(h / pc) * pc), col);

  /* верхняя кромка плиты */
  q(0, groundY, W, pc, grass);
  q(0, groundY + pc, W, pc, hexA(grass, 0.45));

  /* тело платформы: 3 ступени вниз до низа экрана */
  const deep = H - groundY;
  q(0, groundY + pc * 2, W, deep, g1);
  q(0, groundY + pc * 2, W, pc, hexA(g2, 0.85));
  q(0, groundY + deep * 0.42, W, deep, g2);
  q(0, groundY + deep * 0.42, W, pc, hexA(g1, 0.5));

  /* ---- трещины на бетоне ---- */
  const rnd = seeded(G.zone * 449 + 19);
  ctx.strokeStyle = hexA('#000000', 0.34);
  ctx.lineWidth = Math.max(1.5, pc * 0.8);
  for (let i = 0; i < 9; i++) {
    let cx = rnd() * W, cy = groundY + pc * 2 + rnd() * deep * 0.9;
    ctx.beginPath();
    ctx.moveTo(Math.round(cx / pc) * pc, Math.round(cy / pc) * pc);
    const segs = 3 + (rnd() * 4 | 0);
    for (let s = 0; s < segs; s++) {
      cx += (rnd() - 0.5) * pc * 12;
      cy += (rnd() - 0.3) * pc * 5;
      ctx.lineTo(Math.round(cx / pc) * pc, Math.round(cy / pc) * pc);
    }
    ctx.stroke();
  }

  /* стыки плит — вертикальные швы */
  for (let x = 0; x < W; x += pc * 16) {
    q(x, groundY + pc * 2, pc * 0.7, deep * 0.55, hexA('#000000', 0.20));
  }
  /* жёлтая разметка площадки */
  const mk = Math.max(pc, deep * 0.05);
  ctx.globalAlpha = 0.55;
  for (let x = pc * 2; x < W; x += pc * 10) {
    q(x, groundY + deep * 0.18, pc * 5, mk, '#e8c341');
  }
  ctx.globalAlpha = 1;

  /* ---- ЯЩИК «COSMOS» у правого края ---- */
  const bx = Math.round(W * 0.44 / pc) * pc;
  const bw = pc * 13, bh = pc * 9;
  const by = groundY - bh + pc;
  q(bx, by, bw, bh, '#8a6a3c');
  q(bx, by, bw, pc, '#b08a52');
  q(bx, by + bh - pc, bw, pc, '#5c4526');
  q(bx, by, pc, bh, '#b08a52');
  q(bx + bw - pc, by, pc, bh, '#5c4526');
  /* крест-накрест доски */
  ctx.strokeStyle = '#5c4526'; ctx.lineWidth = Math.max(2, pc);
  ctx.beginPath();
  ctx.moveTo(bx + pc, by + pc); ctx.lineTo(bx + bw - pc, by + bh - pc);
  ctx.moveTo(bx + bw - pc, by + pc); ctx.lineTo(bx + pc, by + bh - pc);
  ctx.stroke();
  arcTxt('COSMOS', bx + bw / 2, by + bh / 2, Math.max(U * 6.5, bh * 0.20), '#ffe9a8', 'center', { shadow: Math.max(1, bh * 0.04), maxW: bw - pc });
}
/* ============================== HERO SPRITE ============================== */
/* Скин меняет КОСТЮМ, но красные элементы (гребень шлема, плавники, ботинки)
   остаются красными у всех скинов — это силуэт с референса. */
const SKIN_COLORS = [
  { id: 'base',    suit: '#eef1f7', suitLo: '#b9c0d2', trim: '#d8323e', trimLo: '#8f1f2c', body: '#2b3a6b', visor: '#7cf3ff', cape: '#1a2547', glow: '#7cf3ff' },
  { id: 'crimson', suit: '#e8646f', suitLo: '#a32b3a', trim: '#ffd166', trimLo: '#a8761c', body: '#5c1a24', visor: '#ffb347', cape: '#3a0f16', glow: '#ff4d5e' },
  { id: 'emerald', suit: '#7ff0b0', suitLo: '#2a9e6a', trim: '#d8323e', trimLo: '#8f1f2c', body: '#14402c', visor: '#a8ff8a', cape: '#0a2a1c', glow: '#3ddc84' },
  { id: 'golden',  suit: '#ffd873', suitLo: '#c9932a', trim: '#c8322e', trimLo: '#7d1a18', body: '#5c4410', visor: '#fff0a0', cape: '#3a2a08', glow: '#ffcc44' },
  { id: 'void',    suit: '#c79cf5', suitLo: '#6a3ba8', trim: '#e03a4e', trimLo: '#8f1f2c', body: '#2a1440', visor: '#e0aaff', cape: '#180a26', glow: '#a855f7' },
  { id: 'ice',     suit: '#b8ecff', suitLo: '#4aa9cf', trim: '#d8323e', trimLo: '#8f1f2c', body: '#143a52', visor: '#cffaff', cape: '#0a2434', glow: '#66d9ff' }
];

function skinDef() {
  return SKIN_COLORS.find(s => s.id === G.skin) || SKIN_COLORS[0];
}

/* ---------- Голова героя: 14x14 ----------
   Одна карта на всех: спрайт в бою, аватарка в HUD, превью скина.
   w — шлем, r — красная лента, S — кожа, F — оправа очков, G — стекло,
   b — борода/усы, m — рот.
   Лицо занимает 8 строк из 14 — так человек читается даже на телефоне. */
const HEAD_ROWS = [
  '.....wwww.....',
  '...wwwwwwww...',
  '..wwwwwwwwww..',
  '.wwwwwwwwwwww.',
  '.wwwwwwwwwwww.',
  '.rrrrrrrrrrrr.',
  '.SSSSSSSSSSSS.',
  '.FFFFFFFFFFFF.',
  '.FGGGGFFGGGGF.',
  '.FFFFFFFFFFFF.',
  '.SSbbbbbbbbSS.',
  '..SbbmmmmbbS..',
  '...bbbbbbbb...',
  '....bbbbbb....'
];

const FACE_PAL = {
  S: '#e9b78d', s: '#c08f66',
  F: '#241a2b', G: '#cdeffb',
  b: '#4a3038', m: '#93404b'
};

function headPalette(sk) {
  const p = {};
  for (const k in FACE_PAL) p[k] = FACE_PAL[k];
  p.w = sk.suit;
  p.r = sk.trim;
  p['.'] = null;
  return p;
}

/* ============================== HERO: ПИКСЕЛЬНЫЙ КОСТЮМ ==============================
   Всё в «арт-пикселях» (c), начало координат — ступни героя.
   Спрайт 46 арт-пикселей в высоту, c подбирается от высоты мира. */
function drawHero(cx, baseY, ph, st, skinOverride) {
  const sk = skinOverride || skinDef();
  const c = Math.max(2, (worldH * 0.42) / 46);
  const t = ph;
  const dead = st === 'dead';
  const atk = st === 'attack';

  const bobPx = dead ? 0 : Math.round(Math.sin(t * 2.2) * 1.1);
  const lean = atk ? 1 : 0;

  ctx.save();
  ctx.translate(Math.round(cx), Math.round(baseY + bobPx * c));
  if (dead) ctx.rotate(0.38);

  const q = (x, y, w, h, col) => P(x * c, y * c, w * c, h * c, col);
  const dark = sk.suitLo, light = sk.suit;
  const tr = sk.trim, trD = sk.trimLo;
  const skin = FACE_PAL.S, skinD = FACE_PAL.s;

  /* ---- РЕАКТИВНЫЕ ПЛАВНИКИ НА СПИНЕ (позади корпуса) ---- */
  const flap = dead ? 0 : Math.round(Math.sin(t * 3) * 0.6);
  q(-12 - flap, -24, 5, 8, trD);   /* верхний плавник */
  q(-13 - flap, -20, 4, 6, tr);
  q(-11 - flap, -17, 4, 5, trD);   /* нижний плавник */
  q(-14 - flap, -16, 3, 4, trD);

  /* ---- НОГИ ---- */
  const stepPx = st === 'run' ? Math.round(Math.sin(t * 12)) : 0;
  /* бёдра */
  q(-6, -16, 5, 5, dark);
  q(1, -16, 5, 5, dark);
  /* голени */
  q(-6, -11 + stepPx, 5, 6 - stepPx, dark);
  q(2, -11 - stepPx, 5, 6 + stepPx, light);

  /* ---- БОТИНКИ С КРАСНОЙ ОТДЕЛКОЙ ---- */
  q(-8, -5 + stepPx, 8, 4, tr);
  q(-8, -5 + stepPx, 8, 1, trD);
  q(-8, -1 + stepPx, 9, 1, trD);
  q(2, -5 - stepPx, 8, 4, tr);
  q(2, -5 - stepPx, 8, 1, trD);
  q(3, -1 - stepPx, 8, 1, trD);

  /* ---- КОРПУС ---- */
  q(-9, -27, 18, 13, '#130d1e');      /* тёмный контур силуэта */
  q(-8, -26, 16, 11, light);          /* торс */
  q(-8, -26, 3, 11, '#ffffff');       /* блик слева */
  q(5, -26, 3, 11, dark);             /* тень справа */
  q(-7, -16, 14, 2, dark);            /* низ торса */

  /* наплечники — низкие колпаки поверх плеч */
  q(-11, -28, 5, 3, '#130d1e');
  q(7, -28, 5, 3, '#130d1e');
  q(-10, -28, 3, 2, dark);
  q(8, -28, 3, 2, light);

  /* нагрудная пластина — светлее корпуса */
  q(-6, -25, 12, 8, '#fbfcff');
  q(-6, -25, 12, 1, '#ffffff');
  q(-6, -18, 12, 1, dark);

  /* три чёрных круга на груди — как на референсе */
  const circ = (ox) => {
    q(ox, -24, 3, 3, '#15101a');
    q(ox + 1, -23, 1, 1, '#4a4a5e');
  };
  circ(-6); circ(-2); circ(2);

  /* широкий красный ремень */
  q(-9, -17, 18, 5, '#130d1e');
  q(-8, -16, 16, 3, tr);
  q(-8, -14, 16, 1, trD);
  q(-2, -16, 4, 3, '#ffd166');        /* пряжка */

  /* ---- РУКИ: локти в стороны, кулаки у пояса ---- */
  if (atk) {
    /* удар: ближняя рука выброшена вперёд */
    q(6, -26, 4, 4, light);
    q(9, -25, 6, 4, light);
    q(15, -26, 4, 5, tr);            /* кулак в перчатке */
    q(15, -26, 2, 1, '#ff8a8a');
    /* дальняя рука у груди */
    q(-11, -26, 4, 6, dark);
    q(-9, -21, 6, 4, dark);
    q(-4, -22, 3, 3, trD);
  } else {
    /* дальняя (левая) рука — сплошная цепочка плечо→локоть→кулак */
    q(-11, -27, 4, 12, '#130d1e');       /* контур всей руки */
    q(-10, -27, 2, 5, dark);             /* плечо */
    q(-10, -23, 2, 4, dark);             /* локоть */
    q(-8, -20, 5, 4, dark);              /* предплечье к поясу */
    q(-4, -20, 4, 5, trD);               /* перчатка */
    q(-4, -20, 4, 1, '#c0494f');
    /* ближняя (правая) рука — светлее, читается отдельно */
    q(7, -27, 4, 12, '#130d1e');
    q(7, -27, 3, 5, light);              /* плечо */
    q(7, -23, 3, 4, light);              /* локоть */
    q(3, -20, 6, 4, light);              /* предплечье к поясу */
    q(0, -20, 4, 5, tr);                 /* перчатка */
    q(0, -20, 4, 1, '#ff8a8a');
    q(8, -24, 1, 2, dark);               /* тень на локте */
  }

  /* ---- ШЕЯ ---- */
  q(-2, -29, 4, 3, skinD);

  /* ---- ГОЛОВА ---- */
  spr(HEAD_ROWS, headPalette(sk), (-7 + lean) * c, -41.5 * c, c);

  /* ---- КРАСНЫЙ КОНУС НА ШЛЕМЕ ---- */
  const coneX = (-1 + lean) * c;
  P(coneX, (-45) * c, 2 * c, 1.4 * c, tr);
  P(coneX - 1.2 * c, (-44) * c, 4.4 * c, 1.4 * c, trD);
  P(coneX - 2.4 * c, (-42.6) * c, 6.8 * c, 1.6 * c, tr);

  ctx.restore();
}

/* ============================== АВАТАРКА ИГРОКА ==============================
   То же лицо крупным планом — портрет PLAYER 1 в углу аркадного экрана. */
function drawAvatar(x, y, sz) {
  const c = sz / 16;
  const g = (gx, gy, gw, gh, col) => P(x + gx * c, y + gy * c, gw * c, gh * c, col);
  const sk = skinDef();

  g(0, 0, 16, 16, '#140d22');
  g(0, 0, 16, 1, '#2a1b45');

  /* плечи скафандра */
  g(0, 12, 16, 4, sk.suitLo);
  g(1, 12, 14, 2, sk.suit);
  g(4, 11, 8, 3, sk.trim);

  /* шея */
  g(6, 10, 4, 2, FACE_PAL.s);

  /* голова */
  const pal = headPalette(sk);
  for (let ry = 0; ry < HEAD_ROWS.length; ry++) {
    const row = HEAD_ROWS[ry];
    let rx = 0;
    while (rx < row.length) {
      const ch = row[rx];
      let run = 1;
      while (rx + run < row.length && row[rx + run] === ch) run++;
      const col = pal[ch];
      if (col) g(2 + rx, 0 + ry, run, 1, col);
      rx += run;
    }
  }
  /* конус на шлеме */
  g(7, 0, 2, 1, sk.trim);
  g(6, 1, 4, 1, sk.trimLo);
}

/* Портрет PLAYER 1 в аркадной рамке */
function drawAvatarFrame(x, y, sz) {
  const c = sz / 16;
  arcPanel(x - c, y - c, sz + c * 2, sz + c * 2, '#0d0716', '#ffd166', Math.max(2, U * 3));
  drawAvatar(x, y, sz);
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, sz, c * 0.7);
  ctx.fillRect(x, y + sz - c * 0.7, sz, c * 0.7);
  ctx.restore();
}

/* ============================== MONSTER SPRITES ============================== */
/* 5 archetypes: 0 blob/ghost, 1 eye/cyclops, 2 drone/mech, 3 crawler/insect, 4 crystal */
function drawMonster(m, cx, baseY, mh) {
  const u = U;
  const t = m.ph;
  const scale = m.scale || 1;
  const bob = Math.sin(t * 2.6) * u * 4;
  const cy = baseY + bob - mh / 2;

  ctx.save();
  /* shadow */
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, baseY + 2, u * 22 * scale, u * 5.5 * scale, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  if (m.flash > 0) { ctx.globalAlpha = 1; }
  const flashT = clamp(m.flash, 0, 1);
  const base = m.col || '#c25cff';
  const col = flashT > 0 ? mixHex(base, '#ffffff', flashT * 0.85) : base;

  const arch = m.arch || 0;
  if (arch === 0) drawArchGhost(cx, cy, mh, scale, col, t);
  else if (arch === 1) drawArchEye(cx, cy, mh, scale, col, t);
  else if (arch === 2) drawArchDrone(cx, cy, mh, scale, col, t);
  else if (arch === 3) drawArchCrawler(cx, cy, mh, scale, col, t);
  else drawArchCrystal(cx, cy, mh, scale, col, t);

  if (m.boss) {
    /* crown / aura */
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 3);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = Math.max(1.5, u * 2.4);
    ring(cx, cy, mh * 0.72, t);
    ctx.restore();
  }
  ctx.restore();

  /* hp bar */
  if (m.hp < m.maxHP) drawMonsterHP(m, cx, baseY, mh, scale);
}

function ring(cx, cy, r, t) {
  ctx.beginPath();
  ctx.arc(cx, cy + Math.sin(t * 2) * U * 3, r + Math.sin(t * 3) * U * 3, 0, TAU);
  ctx.stroke();
}

function drawArchGhost(cx, cy, mh, s, col, t) {
  const u = U;
  const r = mh * 0.44;
  /* body: wobbly blob */
  ctx.beginPath();
  const pts = 10;
  for (let i = 0; i <= pts; i++) {
    const a = (i / pts) * TAU;
    const wob = 1 + Math.sin(a * 3 + t * 3) * 0.10;
    const px = cx + Math.cos(a) * r * wob;
    const py = cy + Math.sin(a) * r * wob * 0.95;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r * 1.15);
  g.addColorStop(0, mixHex(col, '#ffffff', 0.45));
  g.addColorStop(0.55, col);
  g.addColorStop(1, hexA(col, 0.35));
  ctx.fillStyle = g;
  ctx.shadowColor = col; ctx.shadowBlur = u * 24;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* eyes */
  const eo = r * 0.30;
  const ey = cy - r * 0.12;
  glowDisc(cx - eo, ey, r * 0.15, '#ffffff', U * 10);
  glowDisc(cx + eo, ey, r * 0.15, '#ffffff', U * 10);
  disc(cx - eo, ey, r * 0.07, '#20002e');
  disc(cx + eo, ey, r * 0.07, '#20002e');

  /* wispy tail */
  ctx.strokeStyle = hexA(col, 0.5);
  ctx.lineWidth = u * 3;
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.8);
  ctx.quadraticCurveTo(cx + r * 0.3, cy + r * 1.4, cx + r * 0.05, cy + r * 1.9);
  ctx.stroke();
}

function drawArchEye(cx, cy, mh, s, col, t) {
  const u = U;
  const r = mh * 0.46;
  /* tentacles */
  ctx.strokeStyle = hexA(col, 0.65);
  ctx.lineWidth = u * 4;
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU + t * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8);
    const a2 = a + Math.sin(t * 2 + i) * 0.4;
    ctx.quadraticCurveTo(
      cx + Math.cos(a2) * r * 1.35, cy + Math.sin(a2) * r * 1.35,
      cx + Math.cos(a2) * r * 1.75, cy + Math.sin(a2) * r * 1.75
    );
    ctx.stroke();
  }
  /* sclera */
  const g = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
  g.addColorStop(0, mixHex(col, '#ffffff', 0.55));
  g.addColorStop(1, col);
  disc(cx, cy, r, null);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = hexA(col, 0.9); ctx.lineWidth = u * 2; ctx.stroke();

  /* iris tracks hero */
  const dx = heroX - cx, dy = (groundY - mh * 0.5) - cy;
  const dl = Math.hypot(dx, dy) || 1;
  const ix = cx + (dx / dl) * r * 0.28;
  const iy = cy + (dy / dl) * r * 0.28;
  disc(ix, iy, r * 0.42, '#1a0026');
  glowDisc(ix, iy, r * 0.22, '#ff5c8a', U * 16);
  disc(ix - r * 0.08, iy - r * 0.10, r * 0.07, '#ffffff');
}

function drawArchDrone(cx, cy, mh, s, col, t) {
  const u = U;
  const r = mh * 0.42;
  /* rotor arms */
  ctx.strokeStyle = hexA(col, 0.8);
  ctx.lineWidth = u * 3.5;
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * TAU + Math.PI / 4 + t * 0.8;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * r * 1.5, cy + Math.sin(a) * r * 1.5);
    ctx.stroke();
    /* rotor blur */
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = hexA('#ffffff', 0.8);
    ctx.lineWidth = u * 1.6;
    ctx.beginPath();
    ctx.ellipse(cx + Math.cos(a) * r * 1.5, cy + Math.sin(a) * r * 1.5, u * 9, u * 3, a, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  /* hull */
  ctx.beginPath();
  for (let i = 0; i <= 6; i++) {
    const a = (i / 6) * TAU;
    const px = cx + Math.cos(a) * r * (i % 2 ? 0.78 : 1);
    const py = cy + Math.sin(a) * r * (i % 2 ? 0.78 : 1);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0, mixHex(col, '#ffffff', 0.35));
  g.addColorStop(0.5, col);
  g.addColorStop(1, mixHex(col, '#000000', 0.4));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = hexA('#ffffff', 0.3); ctx.lineWidth = u * 1.4; ctx.stroke();

  /* core eye */
  const pulse = 0.65 + 0.35 * Math.sin(t * 6);
  glowDisc(cx, cy, r * 0.26, hexA('#ff3c5c', pulse), u * 22);
  disc(cx, cy, r * 0.10, '#fff');
}

function drawArchCrawler(cx, cy, mh, s, col, t) {
  const u = U;
  const r = mh * 0.40;
  /* legs */
  ctx.strokeStyle = hexA(col, 0.75);
  ctx.lineWidth = u * 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const side = i < 2 ? -1 : 1;
    const off = (i % 2) * r * 0.5;
    const wig = Math.sin(t * 8 + i) * u * 4;
    ctx.beginPath();
    ctx.moveTo(cx + side * r * 0.5, cy + off);
    ctx.quadraticCurveTo(cx + side * r * 1.2, cy + off + wig, cx + side * r * 1.5, cy + off + r * 0.8 + wig);
    ctx.stroke();
  }
  /* carapace */
  ctx.beginPath();
  ctx.ellipse(cx, cy, r * 1.05, r * 0.78, 0, 0, TAU);
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r * 1.1);
  g.addColorStop(0, mixHex(col, '#ffffff', 0.4));
  g.addColorStop(1, mixHex(col, '#000000', 0.3));
  ctx.fillStyle = g; ctx.fill();
  /* shell segments */
  ctx.strokeStyle = hexA('#000000', 0.35); ctx.lineWidth = u * 1.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.ellipse(cx + i * r * 0.35, cy, r * 0.16, r * 0.72, 0, 0, TAU);
    ctx.stroke();
  }
  /* eyes */
  glowDisc(cx + r * 0.62, cy - r * 0.30, r * 0.11, '#ffea00', u * 14);
  glowDisc(cx + r * 0.62, cy + r * 0.30, r * 0.11, '#ffea00', u * 14);
}

function drawArchCrystal(cx, cy, mh, s, col, t) {
  const u = U;
  const r = mh * 0.44;
  const n = 6;
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = u * 26;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + t * 0.35;
    const len = r * (0.75 + Math.sin(i * 2.3 + t * 2) * 0.28);
    const w = r * 0.26;
    const px = cx + Math.cos(a) * len * 0.6;
    const py = cy + Math.sin(a) * len * 0.6;
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(a + Math.PI / 2) * w, py + Math.sin(a + Math.PI / 2) * w);
    ctx.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
    ctx.lineTo(px - Math.cos(a + Math.PI / 2) * w, py - Math.sin(a + Math.PI / 2) * w);
    ctx.closePath();
    const g = ctx.createLinearGradient(px, py, cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    g.addColorStop(0, hexA(col, 0.35));
    g.addColorStop(0.6, mixHex(col, '#ffffff', 0.35));
    g.addColorStop(1, hexA(col, 0.95));
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.restore();
  /* core */
  const pulse = 0.6 + 0.4 * Math.sin(t * 4);
  glowDisc(cx, cy, r * 0.30, hexA('#ffffff', pulse * 0.9), u * 30);
}

function drawMonsterHP(m, cx, baseY, mh, scale) {
  const u = U;
  const w = Math.min(W * 0.34, u * 120) * (m.boss ? 1.35 : 1);
  const h = u * (m.boss ? 9 : 6);
  const x = cx - w / 2;
  const y = baseY - mh * 0.92 - u * 20;
  rr(x, y, w, h, h / 2, 'rgba(0,0,0,0.55)');
  const p = clamp(m.hp / m.maxHP, 0, 1);
  const col = p > 0.5 ? '#3ddc84' : p > 0.22 ? '#ffcc44' : '#ff4d5e';
  rr(x + u * 1.2, y + u * 1.2, Math.max(0, (w - u * 2.4) * p), h - u * 2.4, (h - u * 2.4) / 2, col);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = Math.max(1, u);
  rr(x, y, w, h, h / 2, null); ctx.stroke();
}
/* ============================== PARTICLES / FX ============================== */
function puff(x, y, n, col, spd, life) {
  for (let i = 0; i < (n || 5); i++) {
    const a = rand(0, TAU), v = rand(0.3, 1) * (spd || 120) * U;
    parts.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - U * 40,
      life: (life || 0.55) * rand(0.7, 1.3), max: life || 0.55,
      r: rand(U * 1.6, U * 4.2), col: col || '#ffffff', grav: U * 260
    });
  }
}
function floatTxt(s, x, y, col, size) {
  floats.push({ s, x, y, col: col || '#fff', life: 1.0, max: 1.0, size: size || U * 15, vy: -U * 62 });
}
function dropCoins(x, y, n) {
  for (let i = 0; i < (n || 3); i++) {
    coins.push({
      x, y, vx: rand(-U * 90, U * 90), vy: rand(-U * 230, -U * 110),
      life: 1.2, r: U * 4.5
    });
  }
}
function shockRing(x, y, col, rMax) {
  rings.push({ x, y, r: U * 4, rMax: rMax || U * 70, life: 0.5, max: 0.5, col: col || '#fff' });
}
function addSkillFx(type, x, y, col) {
  skillFx.push({ type, x, y, life: 0.75, max: 0.75, col });
}

/* ============================== SPAWNING ============================== */
const ARCH_COLS = ['#c25cff', '#5cf0ff', '#ff6a8a', '#9dfc6f', '#ffb347', '#7c9cff'];
let monsterSerial = 0;

function zoneKey() {
  const keys = ['moon','orbit','mars','europa','belt','nebula','core','void'];
  return keys[Math.min(keys.length - 1, G.zone - 1)];
}

function monsterName(boss) {
  const zk = zoneKey();
  const pool = boss ? (CONTENT.bosses[zk] || []) : (CONTENT.monsters[zk] || []);
  if (pool.length) return pick(pool);
  return boss ? 'БОСС ЗОНЫ ' + G.zone : 'МОНСТР ' + G.zone;
}

function spawnMonster() {
  const boss = G.stage >= 10;
  const hp = mHP(G.zone, G.stage, boss);
  const scale = boss ? 1.55 : rand(0.88, 1.12);
  const arch = boss ? randi(0, 4) : (G.zone + randi(0, 4)) % 5;
  G2.monster = {
    id: ++monsterSerial,
    hp, maxHP: hp,
    boss, arch, scale,
    ph: rand(0, 10),
    x: W * 1.06,
    y: 0,
    gold: mGold(G.zone, G.stage, boss),
    flash: 0,
    col: boss ? '#ffb347' : ARCH_COLS[(arch + G.zone) % ARCH_COLS.length],
    name: monsterName(boss),
    mh: Math.min((boss ? worldH * 0.44 : worldH * 0.30) * scale, W * 0.34),
    hurtT: 0,
    lunge: 0
  };
  if (boss) {
    G2.bossIntro = 1;
    Sfx.boss();
    HAP('crit');
  }
}

function nextMonster() {
  G2.monster = null;
  G2.spawnT = G2.monster === null ? 0 : 0;
}

/* ============================== COMBAT ============================== */
function damageMonster(dmg, isTap, crit) {
  const m = G2.monster;
  if (!m || m.hp <= 0) return;
  m.hp -= dmg;
  m.flash = 1;
  m.hurtT = 0.5;

  const hx = m.x - U * 20;
  const hy = groundY - m.mh * 0.55;
  puff(hx, hy, isTap ? 6 : 3, crit ? '#ffd166' : '#ffffff', isTap ? 170 : 110, 0.4);
  floatTxt(fmt(dmg), hx + rand(-U * 12, U * 12), hy - rand(0, U * 20),
    crit ? '#ffd166' : isTap ? '#7cf3ff' : '#e8e8ff', crit ? U * 19 : U * 14);

  G2.shake = Math.min(U * 9, G2.shake + (crit ? U * 5 : U * 2.2));
  if (crit) { Sfx.crit(); HAP('crit'); } else { Sfx.hit(); }

  if (m.hp <= 0) killMonster();
}

function killMonster() {
  const m = G2.monster;
  if (!m) return;
  const st = stats();
  const gold = Math.floor(m.gold * st.goldM);
  G.gold += gold;
  G.totalGold += gold;
  G.kills++;
  G.stats.taps = G.stats.taps;

  dropCoins(m.x, groundY - m.mh * 0.4, m.boss ? 12 : 4);
  floatTxt('+' + fmt(gold), m.x, groundY - m.mh * 0.5, '#ffd166', U * 17);
  puff(m.x, groundY - m.mh * 0.5, m.boss ? 26 : 12, m.col, m.boss ? 300 : 190, 0.7);
  shockRing(m.x, groundY - m.mh * 0.4, '#ffd166', m.boss ? U * 150 : U * 70);

  Sfx.kill(); HAP('kill');
  G2.shake = U * (m.boss ? 12 : 6);

  if (m.boss) {
    G.stats.bosses++;
    G.gems += 1;
    floatTxt('+' + 1 + ' ◆', m.x, groundY - m.mh * 0.72, '#7cf3ff', U * 16);
    G2.bossIntro = 0;
  }

  /* advance */
  if (G.stage >= 10) { G.stage = 1; G.zone++; G2.zoneT = 1; G2.zoneIn = 1; Sfx.win(); }
  else G.stage++;

  if (G.zone > G.best.zone || (G.zone === G.best.zone && G.stage > G.best.stage)) {
    G.best.zone = G.zone; G.best.stage = G.stage;
  }

  checkAch();
  G2.monster = null;
  G2.spawnT = 0.35;
}

function tapAttack(x, y) {
  if (state !== 'play' || paused) return;
  Sfx.init();
  G2.atkAnim = 1;

  const st = stats();
  let dmg = st.dmg * st.tapM;
  const crit = Math.random() < st.crit;
  if (crit) dmg *= st.cdmg;

  G.stats.taps++;
  if (crit) G.stats.crits++;

  /* combo */
  G2.combo++;
  G2.comboT = 1.4;
  if (G2.combo > G.stats.bestCombo) G.stats.bestCombo = G2.combo;

  const m = G2.monster;
  if (m && m.hp > 0) {
    damageMonster(dmg, true, crit);
  } else {
    /* swing at air */
    puff(heroX + U * 40, groundY - U * 40, 3, '#7cf3ff', 90, 0.35);
    if (crit) Sfx.crit();
  }
  HAP(crit ? 'crit' : 'hit');

  if (G2.combo >= 10) {
    floatTxt(G2.combo + 'x', heroX, groundY - U * 110, '#ff8af0', U * 13);
  }
}

function heroHurt(dmg) {
  const st = stats();
  const real = dmg * (1 - st.armor);
  G2.hp -= real;
  G2.hurt = 1;
  G2.shake = U * 8;
  Sfx.hurt(); HAP('bad');
  puff(heroX, groundY - U * 40, 8, '#ff4d5e', 160, 0.5);
  floatTxt('-' + fmt(real), heroX, groundY - U * 80, '#ff4d5e', U * 15);

  if (G2.hp <= 0) {
    G2.hp = 0;
    heroDown();
  }
}

function heroDown() {
  G.stats.deaths++;
  G2.dead = 1;
  Sfx.bad(); HAP('bad');
  if (G.zone > 1 && G.stage > 1) {
    G.stage = Math.max(1, G.stage - 3);
  } else if (G.stage > 1) {
    G.stage = 1;
  }
  const st = stats();
  G2.maxHP = st.maxHP;
  G2.hp = st.maxHP;
  G2.monster = null;
  G2.spawnT = 1.2;
}

/* ============================== SKILLS ============================== */
function useSkill(id) {
  if (state !== 'play' || paused) return;
  if (skCd[id] > 0) return;
  if (G.zone < SKILLS[id].zoneReq) { showMsg('НУЖНА ЗОНА ' + SKILLS[id].zoneReq); Sfx.bad(); return; }
  const lv = G.sk[id] || 0;
  if (lv <= 0) { showMsg('УМЕНИЕ НЕ КУПЛЕНО'); Sfx.bad(); return; }
  skCd[id] = SKILLS[id].cd;
  const st = stats();
  Sfx.skill();

  if (id === 'strike') {
    const dmg = st.dmg * SKILLS.strike.dmgMul * (1 + lv * 0.5);
    addSkillFx('strike', heroX + U * 50, groundY - U * 60, SKILLS.strike.col);
    shockRing(heroX + U * 50, groundY - U * 60, SKILLS.strike.col, U * 110);
    if (G2.monster) damageMonster(dmg, false, true);
  } else if (id === 'tornado') {
    const dmg = st.dmg * SKILLS.tornado.dmgMul * (1 + lv * 0.5);
    addSkillFx('tornado', G2.monster ? G2.monster.x : W * 0.7, groundY, SKILLS.tornado.col);
    if (G2.monster) damageMonster(dmg, false, false);
    for (let i = 0; i < 14; i++) {
      puff((G2.monster ? G2.monster.x : W * 0.7) + rand(-U * 40, U * 40), groundY - rand(0, U * 80), 1, '#9dfc6f', 200, 0.6);
    }
  } else if (id === 'meteor') {
    const dmg = st.dmg * SKILLS.meteor.dmgMul * (1 + lv * 0.5);
    const tx = G2.monster ? G2.monster.x : W * 0.7;
    addSkillFx('meteor', tx, groundY, SKILLS.meteor.col);
    setTimeout(() => {
      shockRing(tx, groundY - U * 10, '#ff9040', U * 190);
      puff(tx, groundY - U * 20, 30, '#ff9040', 340, 0.9);
      G2.shake = U * 16;
      if (G2.monster) damageMonster(dmg, false, true);
    }, 420);
  } else if (id === 'heal') {
    const heal = st.maxHP * (0.25 + lv * 0.12);
    G2.hp = Math.min(G2.maxHP, G2.hp + heal);
    addSkillFx('heal', heroX, groundY - U * 50, SKILLS.heal.col);
    floatTxt('+' + fmt(heal), heroX, groundY - U * 90, '#69ffa8', U * 16);
    puff(heroX, groundY - U * 40, 16, '#69ffa8', 120, 0.8);
  }
}

  for (const a of ACH) {
    if (G.ach[a.id]) continue;
    if (a.need()) {
      G.ach[a.id] = 1;
      achQueue.push(a);

  if (!achMsg && achQueue.length) {
    achMsg = achQueue.shift();
    achT = 2.6;
    Sfx.win();
  }
}

/* ============================== RELIC SHOP ============================== */
function buyRelic(id) {
  const r = RELICS.find(x => x.id === id);
  if (!r) return false;
  if (G.relics[id]) { showMsg('УЖЕ ОТКРЫТО'); Sfx.bad(); return false; }
  if (G.zone < 4) { showMsg('НУЖНА ЗОНА 4'); Sfx.bad(); return false; }
  if (G.gems < r.cost) { showMsg('НУЖНО ' + r.cost + ' ◆'); Sfx.bad(); HAP('bad'); return false; }
  G.gems -= r.cost;
  G.relics[id] = 1;
  const st = stats();
  G2.maxHP = st.maxHP;
  Sfx.win(); HAP('win');
  showMsg('РЕЛИКВИЯ ОТКРЫТА');
  checkAch(); save();
  return true;
}

/* ============================== SHOP LOGIC ============================== */
function showMsg(s, t) { shopMsg = s; shopMsgT = t || 1.6; }

function buy(key) {
  const c = cost(key);
  if (G.gold < c) { showMsg('НЕ ХВАТАЕТ ' + fmt(c - G.gold) + ' 💰'); Sfx.bad(); HAP('bad'); return false; }
  G.gold -= c;
  G.up[key]++;
  Sfx.buy(); HAP('buy');
  showMsg(UP[key].name + ' УР.' + (G.up[key] + 1));
  if (G.up[key] % 10 === 0) floatTxt(FLAV.level[(G.up[key] / 10 | 0) % FLAV.level.length], heroX, groundY - U * 150, '#9dffc4', U * 15);
  if (key === 'hp') { const st = stats(); G2.maxHP = st.maxHP; G2.hp = Math.min(G2.maxHP, G2.hp + 32); }
  save();
  return true;
}

function buySkill(id) {
  const lv = G.sk[id] || 0;
  if (lv >= 5) { showMsg('МАКСИМАЛЬНЫЙ УРОВЕНЬ'); Sfx.bad(); return false; }
  if (G.zone < SKILLS[id].zoneReq) { showMsg('НУЖНА ЗОНА ' + SKILLS[id].zoneReq); Sfx.bad(); return false; }
  const c = Math.ceil(SKILLS[id].price * Math.pow(2.6, lv));
  if (G.gold < c) { showMsg('НЕ ХВАТАЕТ ' + fmt(c - G.gold)); Sfx.bad(); return false; }
  G.gold -= c;
  G.sk[id] = lv + 1;
  Sfx.buy(); HAP('buy');
  showMsg('УМЕНИЕ УР.' + (lv + 1));
  checkAch(); save();
  return true;
}

function doPrestige() {
  const gain = prestigeGain();
  if (gain <= 0) { showMsg('НУЖНА ЗОНА 5+'); Sfx.bad(); return; }
  G.souls += gain;
  G.prestiges++;
  G.gold = 0; G.zone = 1; G.stage = 1; G.totalGold = 0; G.kills = 0;
  for (const k of UPKEYS) G.up[k] = 0;
  for (const k in SKILLS) G.sk[k] = 0;
  const st = stats();
  G2.maxHP = st.maxHP; G2.hp = st.maxHP;
  G2.monster = null; G2.spawnT = 1;
  Sfx.win(); HAP('win');
  showMsg('+' + gain + ' ДУШ');
  checkAch(); save();
}

/* ============================== UPDATE ============================== */
function update(dt) {
  const now = performance.now() / 1000;

  /* ui animation */
  if (shopOpen && shopT < 1) shopT = Math.min(1, shopT + dt * 5.5);
  if (!shopOpen && shopT > 0) shopT = Math.max(0, shopT - dt * 5.5);
  if (shopMsgT > 0) shopMsgT -= dt;
  if (achT > 0) { achT -= dt; if (achT <= 0) { achMsg = null; } }
  if (!achMsg && achQueue.length) { achMsg = achQueue.shift(); achT = 2.6; }

  /* player */
  G.playTime += dt;
  const st = stats();
  if (G2.maxHP !== st.maxHP) {
    const ratio = G2.maxHP > 0 ? G2.hp / G2.maxHP : 1;
    G2.maxHP = st.maxHP;
    G2.hp = Math.min(G2.maxHP, Math.max(G2.hp, G2.maxHP * ratio));
  }
  if (G2.hp < G2.maxHP && G2.dead <= 0) G2.hp = Math.min(G2.maxHP, G2.hp + st.regen * dt);
  if (st.dps > G.stats.bestDps) G.stats.bestDps = st.dps;

  /* combo decay */
  if (G2.comboT > 0) { G2.comboT -= dt; if (G2.comboT <= 0) G2.combo = 0; }

  /* visuals */
  if (G2.atkAnim > 0) G2.atkAnim = Math.max(0, G2.atkAnim - dt * 4);
  if (G2.shake > 0) G2.shake = Math.max(0, G2.shake - dt * U * 60);
  if (G2.flash > 0) G2.flash = Math.max(0, G2.flash - dt * 5);
  if (G2.hurt > 0) G2.hurt = Math.max(0, G2.hurt - dt * 3);
  if (G2.dead > 0) G2.dead = Math.max(0, G2.dead - dt * 0.9);
  if (G2.zoneIn > 0) G2.zoneIn = Math.max(0, G2.zoneIn - dt * 1.4);
  if (G2.bossIntro > 0) G2.bossIntro = Math.max(0, G2.bossIntro - dt * 0.7);
  if (G2.ultFx > 0) G2.ultFx = Math.max(0, G2.ultFx - dt * 0.85);
  if (G2.ultFlash > 0) G2.ultFlash = Math.max(0, G2.ultFlash - dt * 2.4);
  if (G2.monster) {
    if (G2.monster.flash > 0) G2.monster.flash = Math.max(0, G2.monster.flash - dt * 4);
    if (G2.monster.hurtT > 0) G2.monster.hurtT = Math.max(0, G2.monster.hurtT - dt);
  }

  /* skill cooldowns */
  for (const id in skCd) if (skCd[id] > 0) skCd[id] = Math.max(0, skCd[id] - dt);

  if (state !== 'play' || paused) return;

  /* spawn */
  if (!G2.monster) {
    G2.spawnT -= dt;
    if (G2.spawnT <= 0) spawnMonster();
  } else {
    const m = G2.monster;
    m.ph += dt;
    /* approach */
    const targetX = Math.min(W * 0.72, W - m.mh * 0.85);
    if (m.x > targetX) {
      m.x -= dt * W * 0.19 * (m.boss ? 0.75 : 1);
      if (m.x < targetX) m.x = targetX;
    } else {
      m.x = targetX + Math.sin(now * 1.6) * U * 8;
    }

    /* hero auto attack */
    G2.atkT -= dt;
    if (G2.atkT <= 0) {
      G2.atkT = 1 / st.aps;
      G2.atkAnim = 1;
      const crit = Math.random() < st.crit;
      let dmg = st.dmg;
      if (crit) dmg *= st.cdmg;
      damageMonster(dmg, false, crit);
    }

    /* allies */
    if (st.ally > 0) {
      G2.allyT -= dt;
      if (G2.allyT <= 0) {
        G2.allyT = 0.85;
        const ax = heroX + U * 70 + rand(-U * 30, U * 30);
        puff(ax, groundY - U * 120, 2, '#7c9cff', 120, 0.35);
        floatTxt(fmt(st.ally), ax, groundY - U * 130, '#7c9cff', U * 11);
        if (G2.monster) damageMonster(st.ally, false, false);
      }
    }

    /* monster attack */
    G2.mAtkT -= dt;
    if (G2.mAtkT <= 0) {
      G2.mAtkT = m.boss ? 1.5 : 2.1;
      const mdmg = mHP(G.zone, G.stage, m.boss) * 0.26 + G.zone * 4;
      m.lunge = 1;
      heroHurt(mdmg);
      puff(m.x - U * 20, groundY - m.mh * 0.5, 6, m.col, 150, 0.4);
    }
    if (m.lunge > 0) m.lunge = Math.max(0, m.lunge - dt * 3);
  }

  /* particles */
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += p.grav * dt;
    p.vx *= 0.98;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.vy += U * 700 * dt;
    c.life -= dt;
    if (c.life <= 0) coins.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y += f.vy * dt; f.vy *= 0.97;
    f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r = lerp(r.r, r.rMax, dt * 6);
    r.life -= dt;
    if (r.life <= 0) rings.splice(i, 1);
  }
  for (let i = skillFx.length - 1; i >= 0; i--) {
    skillFx[i].life -= dt;
    if (skillFx[i].life <= 0) skillFx.splice(i, 1);
  }

  spawnMeteor();

  /* zone transition */
  if (G2.zoneIn > 0) {
    G2.zoneIn = Math.max(0, G2.zoneIn - dt);
  }

  /* auto buy */
  if (G.auto.buy && Math.random() < dt * 2) {
    const order = ['dmg', 'spd', 'gold', 'tap', 'hp'];
    for (const k of order) {
      if (G.gold >= cost(k) * 1.6) { buy(k); break; }
    }
  }
}

let layout = { shop: null, btn: null, skillBtns: [], cards: [], tabs: [], closeBtn: null, buyAll: null, skinCards: [], achRows: [], prBtn: null, doomBtn: null };

function drawBolt(x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x, y + h * 0.42); ctx.lineTo(x + w * 0.40, y + h * 0.42);
  ctx.lineTo(x + w * 0.55, y); ctx.lineTo(x + w * 0.52, y + h * 0.38);
  ctx.lineTo(x + w, y + h * 0.38); ctx.lineTo(x + w * 0.42, y + h);
  ctx.lineTo(x + w * 0.48, y + h * 0.55); ctx.lineTo(x, y + h * 0.55);
  ctx.closePath(); ctx.fill();
}

function statIcon(kind, cx, cy, r, col) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1, r * 0.22);
  if (kind === 'dmg') {
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, r * 0.7); ctx.lineTo(r * 0.55, -r * 0.7);
    ctx.lineTo(r * 0.15, -r * 0.05); ctx.lineTo(r * 0.7, -r * 0.35);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'spd') {
    drawBolt(-r * 0.6, -r * 0.75, r * 1.2, r * 1.5);
  } else if (kind === 'crit') {
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 2 + 0.3);
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.9); ctx.lineTo(r * 0.24, -r * 0.2); ctx.lineTo(0, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    disc(0, 0, r * 0.26, col);
  } else if (kind === 'cdmg') {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * TAU / 5;
      const a2 = a + TAU / 10;
      ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
      ctx.lineTo(Math.cos(a2) * r * 0.42, Math.sin(a2) * r * 0.42);
    }
    ctx.closePath(); ctx.fill();
  } else if (kind === 'tap') {
    disc(0, r * 0.15, r * 0.55, col);
    ctx.fillRect(-r * 0.18, -r * 0.95, r * 0.36, r * 0.8);
  } else if (kind === 'gold') {
    disc(0, 0, r * 0.9, col);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    txt('$', 0, 0, r * 1.3, 'rgba(0,0,0,0.5)', 'center');
  } else if (kind === 'hp') {
    ctx.beginPath();
    ctx.moveTo(0, r * 0.75);
    ctx.bezierCurveTo(-r * 1.15, -r * 0.15, -r * 0.45, -r * 1.0, 0, -r * 0.4);
    ctx.bezierCurveTo(r * 0.45, -r * 1.0, r * 1.15, -r * 0.15, 0, r * 0.75);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'regen') {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.9);
    ctx.lineTo(-r * 0.7, r * 0.15); ctx.lineTo(-r * 0.1, r * 0.15);
    ctx.lineTo(-r * 0.15, r * 0.9); ctx.lineTo(r * 0.7, -r * 0.2);
    ctx.lineTo(r * 0.08, -r * 0.2);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'armor') {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.95);
    ctx.lineTo(r * 0.85, -r * 0.55);
    ctx.lineTo(r * 0.7, r * 0.45);
    ctx.lineTo(0, r * 0.95);
    ctx.lineTo(-r * 0.7, r * 0.45);
    ctx.lineTo(-r * 0.85, -r * 0.55);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'a1') {
    disc(0, 0, r * 0.42, col);
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, r * 0.16);
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55);
      ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
      ctx.stroke();
    }
  } else if (kind === 'a2') {
    ctx.fillRect(-r * 0.7, -r * 0.25, r * 1.4, r * 0.5);
    ctx.fillRect(-r * 0.12, -r * 0.9, r * 0.24, r * 1.8);
  } else if (kind === 'a3') {
    ctx.fillRect(-r * 0.9, -r * 0.35, r * 1.5, r * 0.7);
    ctx.beginPath();
    ctx.moveTo(r * 0.6, -r * 0.35); ctx.lineTo(r * 1.0, 0); ctx.lineTo(r * 0.6, r * 0.35);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'skull') {
    disc(0, -r * 0.15, r * 0.7, col);
    ctx.fillRect(-r * 0.42, r * 0.4, r * 0.84, r * 0.42);
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    disc(-r * 0.28, -r * 0.2, r * 0.2);
    disc(r * 0.28, -r * 0.2, r * 0.2);
  } else if (kind === 'soul') {
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r * 0.95, -r * 0.1, r * 0.5, r, 0, r);
    ctx.bezierCurveTo(-r * 0.5, r, -r * 0.95, -r * 0.1, 0, -r);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ============================== HUD ============================== */
function drawHUD() {
  const u = U;
  const st = stats();
  const pad = u * 12;

  /* ================= PLAYER 1: портрет + монеты ================= */
  const avS = Math.round(u * 46);
  const avX = pad, avY = pad;
  drawAvatarFrame(avX, avY, avS);

  /* подпись PLAYER 1 под портретом — аркадная плашка */
  const tagW = Math.max(avS, u * 52);
  const tagH = u * 14;
  const tagX = avX + avS / 2 - tagW / 2;
  const tagY = avY + avS + u * 4;
  arcPanel(tagX, tagY, tagW, tagH, '#8f1f2c', '#ffd166', u * 3);
  arcTxt('PLAYER 1', tagX + tagW / 2, tagY + tagH / 2, u * 9.5, '#ffe9a8', 'center', { shadow: 1.2, maxW: tagW - u * 4 });

  /* ---- монеты / гемы / души: жёлтые бары справа от портрета ---- */
  let cx = avX + avS + u * 8;
  const rowY = avY + u * 2;
  const chipH = u * 22;

  const goldStr = fmt(G.gold);
  const pillW = Math.max(u * 96, u * 22 + goldStr.length * u * 9.6);
  arcPanel(cx, rowY, pillW, chipH, 'rgba(12,7,22,0.90)', '#ffd166', u * 3);
  disc(cx + u * 12, rowY + chipH / 2, u * 6.5, '#ffd166');
  arcTxt('$', cx + u * 12, rowY + chipH / 2, u * 9, 'rgba(70,40,0,0.9)', 'center', { shadow: 0 });
  arcTxt(goldStr, cx + u * 23, rowY + chipH / 2, u * 11.5, '#ffe9a8', 'left', { shadow: 1, maxW: pillW - u * 27 });
  cx += pillW + u * 6;

  const chip2Y = rowY + chipH + u * 4;
  if (G.gems > 0) {
    const w2 = u * 52;
    arcPanel(cx, rowY, w2, chipH, 'rgba(12,7,22,0.90)', '#7cf3ff', u * 3);
    statIcon('crit', cx + u * 11, rowY + chipH / 2, u * 6, '#7cf3ff');
    arcTxt(String(G.gems), cx + u * 20, rowY + chipH / 2, u * 11, '#c8f7ff', 'left', { shadow: 1, maxW: w2 - u * 23 });
    cx += w2 + u * 6;
  }
  if (G.souls > 0) {
    const w3 = u * 56;
    arcPanel(cx, rowY, w3, chipH, 'rgba(12,7,22,0.90)', '#c77dff', u * 3);
    statIcon('soul', cx + u * 11, rowY + chipH / 2, u * 6, '#c77dff');
    arcTxt(String(G.souls), cx + u * 20, rowY + chipH / 2, u * 11, '#e0c8ff', 'left', { shadow: 1, maxW: w3 - u * 23 });
  }

  /* ================= ЗОНА / ЭТАП: центр сверху ================= */
  const zx = W / 2, zy = pad + u * 6;
  const zd = zoneDef(G.zone);
  const zname = (CONTENT.zones && CONTENT.zones[zoneKey()]) || zd.name;
  const zoneLabel = Math.min(u * 13, W * 0.055);
  arcTxt(zname, zx, zy, zoneLabel, '#ffe9a8', 'center', { shadow: 1.6, maxW: W * 0.46 });
  arcTxt('ЗОНА ' + G.zone + '  ЭТАП ' + G.stage + '/10', zx, zy + u * 17, u * 9.5, hexA(zd.accent, 0.95), 'center', { shadow: 1 });

  /* stage pips — квадратные, аркадные */
  const pipN = 10, pipW = u * 8, pipGap = u * 3;
  const totW = pipN * pipW + (pipN - 1) * pipGap;
  let ppx = zx - totW / 2;
  const ppy = zy + u * 28;
  for (let i = 0; i < pipN; i++) {
    const on = i < G.stage - 1;
    const isBoss = i === pipN - 1;
    const col = on ? (isBoss ? '#ffd166' : '#ff4d5e') : 'rgba(255,255,255,0.12)';
    P(ppx, ppy, pipW, u * 5, col);
    if (on) P(ppx, ppy, pipW, u * 1.6, hexA('#ffffff', 0.55));
    ppx += pipW + pipGap;
  }

  /* ================= HP-БАР: аркадный, в рамочке ================= */
  const bw = Math.min(W * 0.50, u * 260);
  const bh = u * 18;
  const bx = pad, by = H - pad - bh - u * 16;
  const fr = u * 3;
  arcPanel(bx - fr, by - fr, bw + fr * 2, bh + fr * 2, 'rgba(8,4,16,0.92)', '#ffd166', u * 4);

  const hpP = clamp(G2.hp / G2.maxHP, 0, 1);
  const hpCol = hpP > 0.5 ? '#3ddc84' : hpP > 0.22 ? '#ffcc44' : '#ff4d5e';
  P(bx, by, bw * hpP, bh, hpCol);
  P(bx, by, bw * hpP, bh * 0.32, hexA('#ffffff', 0.28));
  /* диагональная штриховка «сегментов» — как на аркадных барах */
  ctx.globalAlpha = 0.20;
  for (let x = bx; x < bx + bw; x += u * 7) P(x, by, u * 2.4, bh, '#000');
  ctx.globalAlpha = 1;

  arcTxt('HP ' + Math.ceil(G2.hp) + '/' + Math.ceil(G2.maxHP), bx + bw / 2, by + bh / 2,
    u * 10, '#ffffff', 'center', { shadow: 1.4, maxW: bw - u * 8 });

  /* DPS-плашка */
  arcTxt('DPS ' + (st.dps < 10 ? st.dps.toFixed(1) : fmt(st.dps)), bx, by - u * 14,
    u * 9.5, '#7cf3ff', 'left', { shadow: 1 });

  /* ================= КОМБО ================= */
  if (G2.combo >= 3) {
    const a = clamp(G2.comboT / 1.4, 0, 1);
    const scale = 1 + (1 - a) * 0.15 + Math.min(G2.combo, 60) * 0.004;
    ctx.save();
    ctx.globalAlpha = 0.35 + a * 0.65;
    ctx.translate(W - pad - u * 34, H - pad - u * 52);
    ctx.scale(scale, scale);
    const cc = G2.combo >= 20 ? '#ff8af0' : '#7cf3ff';
    arcTxt(G2.combo + 'x', 0, -u * 6, u * 24, cc, 'center', { shadow: 2 });
    arcTxt('КОМБО', 0, u * 14, u * 9, '#ffe9a8', 'center', { shadow: 1 });
    ctx.restore();
  }

  /* ================= КНОПКИ СКИЛЛОВ ================= */
  layoutSkillBtns(bw, bh, by);
  for (let i = 0; i < 4; i++) {
    const id = SKORDER[i];
    const b = layout.skillBtns[i];
    if (!b) continue;
    const lv = G.sk[id] || 0;
    const locked = G.zone < SKILLS[id].zoneReq || lv <= 0;
    const cd = skCd[id];
    const ready = cd <= 0 && !locked;
    const col = SKILLS[id].col;

    /* квадратная аркадная кнопка со скосом */
    arcPanel(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2, locked ? 'rgba(16,10,26,0.90)' : 'rgba(10,6,24,0.92)',
      ready ? hexA(col, 0.95) : 'rgba(255,255,255,0.16)', b.r * 0.30);

    if (ready) {
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = u * 12;
      ctx.strokeStyle = hexA(col, 0.8); ctx.lineWidth = Math.max(1.5, u * 1.8);
      ctx.strokeRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
      ctx.restore();
    }

    /* кулдаун: заливка снизу вверх */
    if (cd > 0) {
      const frac = clamp(cd / SKILLS[id].cd, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.66)';
      ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2 * frac);
    }

    ctx.globalAlpha = locked ? 0.35 : 1;
    drawSkillIcon(id, b.x, b.y - b.r * 0.10, b.r * 0.52, col);
    ctx.globalAlpha = 1;

    if (locked) {
      const zreq = G.zone < SKILLS[id].zoneReq;
      arcTxt(zreq ? 'Z' + SKILLS[id].zoneReq : fmt(SKILLS[id].price), b.x, b.y + b.r * 0.60,
        zreq ? u * 9 : u * 8, '#ffe9a8', 'center', { shadow: 1, maxW: b.r * 1.9 });
    } else if (cd > 0) {
      arcTxt(String(Math.ceil(cd)), b.x, b.y + b.r * 0.52, u * 12, '#ffffff', 'center', { shadow: 1.5 });
    }
    if (lv > 1) {
      arcTxt(String(lv), b.x + b.r * 0.66, b.y - b.r * 0.66, u * 9, '#ffd166', 'center', { shadow: 1 });
    }
  }
  drawUltBtn();
}

function layoutSkillBtns(bw, bh, by) {
  const u = U;
  const r = Math.min(u * 25, W * 0.045);
  const gap = r * 2.4;
  const shopX = W - u * 14 - u * 76;
  const startX = shopX - u * 12 - r;
  const y = by + bh / 2 - r * 0.2;
  layout.skillBtns = [];
  for (let i = 0; i < 4; i++) {
    layout.skillBtns.push({ x: startX - i * gap, y, r });
  }
  /* ultimate button — bigger, floating above the row */
  const ur = r * 1.42;
  layout.ultBtn = { x: startX, y: y - ur - r * 1.25, r: ur };
}

function drawUltBtn() {
  const u = U;
  const b = layout.ultBtn;
  if (!b) return;
  const t = performance.now() / 1000;
  const cd = skCd.ult;
  const ready = cd <= 0 && G.zone >= ULT.zoneReq && G.gems >= ULT.cost;
  const locked = G.zone < ULT.zoneReq;

  /* rotating halo */
  if (ready) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(t * 1.1);
    ctx.strokeStyle = hexA(ULT.col, 0.6);
    ctx.lineWidth = Math.max(1.4, u * 2.2);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, b.r + u * 5, i * TAU / 3, i * TAU / 3 + 0.7);
      ctx.stroke();
    }
    ctx.restore();
  }

  disc(b.x, b.y, b.r, locked ? 'rgba(20,16,34,0.78)' : 'rgba(14,6,30,0.88)');
  const g = ctx.createRadialGradient(b.x, b.y - b.r * 0.35, b.r * 0.15, b.x, b.y, b.r);
  g.addColorStop(0, hexA(ULT.col, ready ? 0.55 : 0.20));
  g.addColorStop(1, hexA('#12081f', 0.9));
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fillStyle = g; ctx.fill();

  ctx.strokeStyle = ready ? hexA(ULT.col, 0.95) : 'rgba(255,255,255,0.18)';
  ctx.lineWidth = ready ? Math.max(2, u * 2.6) : 1.4;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
  if (ready) {
    ctx.save(); ctx.shadowColor = ULT.col; ctx.shadowBlur = u * 20;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* star glyph */
  ctx.save();
  ctx.translate(b.x, b.y - b.r * 0.05);
  ctx.globalAlpha = locked ? 0.4 : 1;
  ctx.fillStyle = ready ? '#fff' : hexA(ULT.col, 0.75);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr2 = i % 2 ? b.r * 0.26 : b.r * 0.56;
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const px = Math.cos(ang) * rr2, py = Math.sin(ang) * rr2;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  if (cd > 0) {
    const frac = cd / ULT.cd;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.66)'; ctx.fill();
    txt(Math.ceil(cd), b.x, b.y, u * 15, '#fff', 'center', '900');
  } else if (locked) {
    txt('Z' + ULT.zoneReq, b.x, b.y, u * 12, 'rgba(255,255,255,0.6)', 'center', '900');
  } else {
    txt(String(ULT.cost) + '◆', b.x, b.y + b.r * 0.66, u * 10, '#ffb3f0', 'center', '900');
  }
}

function drawSkillIcon(id, x, y, r, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = col; ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.2, r * 0.3);
  if (id === 'strike') {
    ctx.beginPath();
    ctx.moveTo(-r, r * 0.75); ctx.lineTo(r * 0.9, -r * 0.9);
    ctx.lineTo(r * 0.25, -r * 0.1); ctx.lineTo(r, -r * 0.45);
    ctx.closePath(); ctx.fill();
  } else if (id === 'tornado') {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(0, -r * 0.5 + i * r * 0.5, r * (0.9 - i * 0.22), Math.PI * 0.15, Math.PI * 1.3);
      ctx.stroke();
    }
  } else if (id === 'meteor') {
    disc(0, r * 0.35, r * 0.62, col);
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, r * 0.1); ctx.lineTo(-r * 1.0, -r * 1.0);
    ctx.lineTo(r * 0.05, r * 0.05); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.95);
    ctx.bezierCurveTo(r * 0.95, 0, r * 0.45, r * 0.95, 0, r * 0.95);
    ctx.bezierCurveTo(-r * 0.45, r * 0.95, -r * 0.95, 0, 0, -r * 0.95);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ============================== SHOP ============================== */
const TABS = [
  { id: 'atk', name: 'АТАКА', keys: ['dmg','spd','crit','cdmg','tap'] },
  { id: 'def', name: 'ЗАЩИТА', keys: ['hp','regen','armor'] },
  { id: 'sq',  name: 'ОТРЯД', keys: ['a1','a2','a3'] },
  { id: 'sk',  name: 'УМЕНИЯ', keys: [] },
  { id: 'rel', name: 'РЕЛИКВИИ', keys: [] },
  { id: 'ach', name: 'НАГРАДЫ', keys: [] },
  { id: 'pr',  name: 'ПРОЧЕЕ', keys: [] }
];

function layoutShop() {
  const u = U;
  const sw = Math.min(W * 0.94, u * 520);
  const sh = Math.min(H * 0.86, u * 620);
  const sx = (W - sw) / 2;
  const sy = (H - sh) / 2;

  layout.shop = { x: sx, y: sy, w: sw, h: sh };

  /* close btn */
  const cb = u * 17;
  layout.closeBtn = { x: sx + sw - cb * 2.4, y: sy + cb * 1.5, r: cb };

  /* tabs */
  const tabH = u * 28;
  const tabY = sy + u * 46;
  const tabW = (sw - u * 20) / TABS.length;
  layout.tabs = TABS.map((t, i) => ({
    id: t.id, x: sx + u * 10 + i * tabW, y: tabY, w: tabW, h: tabH
  }));

  /* content area */
  const cTop = tabY + tabH + u * 10;
  const cBot = sy + sh - u * 16;
  layout.content = { x: sx + u * 14, y: cTop, w: sw - u * 28, h: cBot - cTop };

  /* skill cards */
  layout.skillCards = [];
  if (tab === 'sk') {
    const n = SKORDER.length;
    const cardH = Math.min(u * 96, (layout.content.h - (n - 1) * u * 10) / n);
    SKORDER.forEach((id, i) => {
      layout.skillCards.push({
        id,
        x: layout.content.x,
        y: layout.content.y + i * (cardH + u * 10),
        w: layout.content.w, h: cardH
      });
    });
  }

  /* cards */
  const t = TABS.find(t => t.id === tab);
  const keys = t ? t.keys : [];
  layout.cards = [];
  if (keys.length) {
    const cardH = Math.min(u * 112, (layout.content.h - (keys.length - 1) * u * 10) / keys.length);
    keys.forEach((k, i) => {
      layout.cards.push({
        key: k,
        x: layout.content.x,
        y: layout.content.y + i * (cardH + u * 10),
        w: layout.content.w,
        h: cardH
      });
    });
  }

  /* relics tab layout */
  layout.relicCards = [];
  if (tab === 'rel') {
    const gap = u * 8;
    const cw = (layout.content.w - gap) / 2;
    const chh = u * 58;
    RELICS.forEach((r, i) => {
      const row = Math.floor(i / 2), col = i % 2;
      layout.relicCards.push({
        id: r.id,
        x: layout.content.x + col * (cw + gap),
        y: layout.content.y + u * 74 + row * (chh + gap),
        w: cw, h: chh
      });
    });
    layout.dailyBtn = { x: layout.content.x, y: layout.content.y, w: layout.content.w, h: u * 62 };
  }

  /* prestige / other buttons in "pr" tab */
  layout.prBtn = { x: layout.content.x, y: layout.content.y + u * 6, w: layout.content.w, h: u * 96 };
  layout.buyAll = { x: layout.content.x, y: layout.content.y + u * 110, w: layout.content.w, h: u * 36 };
  layout.skinBtn = { x: layout.content.x, y: layout.content.y + u * 152, w: layout.content.w, h: u * 36 };

  /* skin cards */
  layout.skinCards = [];
  if (tab === 'pr') {
    const cols = 3, gap = u * 8;
    const cw = (layout.content.w - gap * (cols - 1)) / cols;
    const chh = u * 58;
    SKIN_COLORS.forEach((s, i) => {
      const r = Math.floor(i / cols), c = i % cols;
      layout.skinCards.push({
        skin: s.id,
        x: layout.content.x + c * (cw + gap),
        y: layout.content.y + u * 186 + r * (chh + gap),
        w: cw, h: chh
      });
    });
  }
}

/* Аркадная карточка: скошенная панель с рамкой и «заголовком». */
function arcCard(x, y, w, h, fill, border, cut) {
  arcPanel(x + Math.max(2, U * 2.5), y + Math.max(2, U * 2.5), w, h, '#0a0512', null, cut);
  arcPanel(x, y, w, h, fill, border, cut);
}

function drawShop() {
  if (shopT <= 0) return;
  const u = U;
  const t = shopT;
  const e = 1 - Math.pow(1 - t, 3);
  const L = layout.shop;
  if (!L) { layoutShop(); return; }
  const pxs = Math.max(2, u * 2.4);

  /* dim */
  P(0, 0, W, H, 'rgba(4,2,10,' + (0.74 * e) + ')');

  ctx.save();
  ctx.translate(0, (1 - e) * H * 0.5);
  ctx.globalAlpha = e;

  /* ===== ГЛАВНАЯ ПАНЕЛЬ ===== */
  arcPanel(L.x + pxs * 3, L.y + pxs * 3, L.w, L.h, '#07030e', null, u * 16);
  arcPanel(L.x, L.y, L.w, L.h, '#140a24', '#ffd166', u * 16);
  arcPanel(L.x + pxs * 2, L.y + pxs * 2, L.w - pxs * 4, L.h - pxs * 4, null, '#8f1f2c', u * 13);

  /* «болты» по углам */
  const bolt = (bx, by) => { P(bx, by, pxs * 2, pxs * 2, '#ffd166'); P(bx + pxs * 0.4, by + pxs * 0.4, pxs, pxs, '#8f1f2c'); };
  bolt(L.x + u * 8, L.y + u * 8);
  bolt(L.x + L.w - u * 8 - pxs * 2, L.y + u * 8);
  bolt(L.x + u * 8, L.y + L.h - u * 8 - pxs * 2);
  bolt(L.x + L.w - u * 8 - pxs * 2, L.y + L.h - u * 8 - pxs * 2);

  /* ===== ШАПКА ===== */
  const TITLES = { atk: 'АТАКА', def: 'ЗАЩИТА', sq: 'ОТРЯД', sk: 'УМЕНИЯ', rel: 'РЕЛИКВИИ', ach: 'НАГРАДЫ', pr: 'ПРОЧЕЕ' };
  const headW = Math.min(L.w - u * 90, u * 260);
  arcPanel(L.x + u * 20, L.y + u * 12, headW, u * 30, '#8f1f2c', '#ffd166', pxs * 2);
  arcTxt(TITLES[tab] || 'УЛУЧШЕНИЯ', L.x + u * 20 + headW / 2, L.y + u * 27, u * 15, '#ffd166', 'center', { shadow: pxs * 0.8, shadowCol: '#3a0f16', maxW: headW - u * 12 });

  /* золото справа от заголовка */
  arcTxt('CREDIT', L.x + u * 20 + headW + u * 16, L.y + u * 21, u * 9, '#9a8fc0', 'left');
  arcTxt(fmt(G.gold), L.x + u * 20 + headW + u * 16, L.y + u * 36, u * 12.5, '#ffd166', 'left', { shadow: pxs * 0.7, shadowCol: '#3a0f16' });

  /* закрыть — квадратная кнопка */
  const cb = layout.closeBtn;
  const cs = cb.r * 1.55;
  arcPanel(cb.x - cs / 2, cb.y - cs / 2, cs, cs, '#2a1220', '#ff4d5e', pxs * 2);
  const d = cs * 0.24;
  ctx.save();
  ctx.strokeStyle = '#ff8a8a'; ctx.lineWidth = Math.max(2, u * 2.6);
  ctx.beginPath();
  ctx.moveTo(cb.x - d, cb.y - d); ctx.lineTo(cb.x + d, cb.y + d);
  ctx.moveTo(cb.x + d, cb.y - d); ctx.lineTo(cb.x - d, cb.y + d);
  ctx.stroke();
  ctx.restore();

  /* ===== ТАБЫ ===== */
  const tabFills = ['#1d1436', '#0f0a20'];
  for (const tb of layout.tabs) {
    const on = tab === tb.id;
    const bw2 = tb.w - u * 3, bh2 = tb.h - u * 4;
    if (on) {
      arcPanel(tb.x + u * 1.5, tb.y + u * 2, bw2, bh2, '#d8323e', '#ffd166', u * 5);
    } else {
      arcPanel(tb.x + u * 1.5, tb.y + u * 2, bw2, bh2, tabFills[1], '#3d2f66', u * 5);
    }
    const name = TABS.find(x => x.id === tb.id).name;
    arcTxt(name, tb.x + tb.w / 2, tb.y + tb.h / 2 + u * 1, Math.min(u * 10, tb.w / name.length * 1.55), on ? '#fff6e0' : '#8f86b8', 'center', { shadow: on ? pxs * 0.7 : pxs * 0.4, shadowCol: '#2a0a12', maxW: bw2 - u * 4 });
  }

  /* ===== КОНТЕНТ ===== */
  if (tab === 'pr') drawPrestigeTab();
  else if (tab === 'sk') drawSkillCards();
  else if (tab === 'rel') drawRelicsTab();
  else if (tab === 'ach') drawAchTab();
  else drawUpgradeCards();

  /* ===== СООБЩЕНИЕ ===== */
  if (shopMsgT > 0 && shopMsg) {
    const a = clamp(shopMsgT / 0.5, 0, 1);
    ctx.globalAlpha = e * a;
    const mw = Math.min(layout.content.w, u * 320);
    const mx = L.x + (L.w - mw) / 2, my = L.y + L.h - u * 40;
    arcPanel(mx, my, mw, u * 30, '#8f1f2c', '#ffd166', u * 6);
    arcTxt(shopMsg, L.x + L.w / 2, my + u * 15, u * 11, '#fff6e0', 'center', { shadow: pxs * 0.6, shadowCol: '#3a0f16', maxW: mw - u * 14 });
    ctx.globalAlpha = e;
  }

  ctx.restore();
}

function drawRelicsTab() {
  const u = U;
  const C = layout.content;
  const now = performance.now() / 1000;
  const pxs = Math.max(2, u * 2.2);

  /* ---- ежедневная награда ---- */
  const db = layout.dailyBtn;
  if (db) {
    const ready = dailyReady();
    const d = DAILY[dailyIdx()];
    arcPanel(db.x + pxs * 2, db.y + pxs * 2, db.w, db.h, '#08040f', null, u * 8);
    arcPanel(db.x, db.y, db.w, db.h, ready ? '#3a2a10' : '#150e24', ready ? '#ffd166' : '#302450', u * 8);
    /* мигающая рамка, когда можно забрать */
    if (ready && Math.sin(now * 4) > 0) {
      arcPanel(db.x + pxs, db.y + pxs, db.w - pxs * 2, db.h - pxs * 2, null, '#fff2c0', u * 7);
    }

    /* пиксельный подарок */
    const gx = db.x + u * 30, gy = db.y + db.h / 2;
    const gc = ready ? '#ffd166' : '#5f5583';
    const gd = ready ? '#8a6410' : '#2a2245';
    P(gx - u * 12, gy - u * 7, u * 24, u * 15, gc);
    P(gx - u * 13, gy - u * 9, u * 26, u * 3, gc);
    P(gx - u * 12, gy - u * 1, u * 24, u * 3, gd);
    P(gx - u * 2, gy - u * 9, u * 4, u * 17, gd);
    P(gx - u * 13, gy - u * 9, u * 26, pxs, '#fff2c0');

    arcTxt('ЕЖЕДНЕВНАЯ НАГРАДА', db.x + u * 54, db.y + db.h * 0.34, u * 11.5,
      ready ? '#ffe9a8' : '#6f6592', 'left', { shadow: pxs * 0.5, maxW: db.w - u * 210 });
    arcTxt('ДЕНЬ ' + ((G.daily.streak || 0) % 7 + 1) + '/7 • ' + d.name,
      db.x + u * 54, db.y + db.h * 0.68, u * 9, ready ? '#c8a04a' : '#5f5583', 'left', { shadow: pxs * 0.4, maxW: db.w - u * 210 });

    const bw = u * 88, bh = u * 30;
    const bx = db.x + db.w - bw - u * 10, byy = db.y + db.h / 2 - bh / 2;
    if (ready) {
      arcPanel(bx + pxs * 1.5, byy + pxs * 1.5, bw, bh, '#3a2400', null, u * 5);
      arcPanel(bx, byy, bw, bh, '#ffd166', '#fff2c0', u * 5);
    } else {
      arcPanel(bx, byy, bw, bh, '#1a1229', '#302450', u * 5);
    }
    arcTxt(ready ? 'ЗАБРАТЬ' : 'ЖДЁМ', bx + bw / 2, byy + bh / 2, u * 10,
      ready ? '#3a2400' : '#5f5583', 'center', { shadow: 0, maxW: bw - u * 6 });
    layout.dailyClaim = { x: bx, y: byy, w: bw, h: bh };
  }

  /* ---- заголовок ---- */
  arcTxt('РЕЛИКВИИ', C.x, C.y + u * 68, u * 12, '#f0e8ff', 'left', { shadow: pxs * 0.6 });
  arcTxt('◆ ' + G.gems, C.x + C.w, C.y + u * 68, u * 12.5, '#7cf3ff', 'right', { shadow: pxs * 0.6 });

  /* ---- карточки реликвий ---- */
  for (const card of layout.relicCards) {

      owned ? r.col : affordable ? '#3ddc84' : '#302450', u * 7);
    /* угловая метка владения */
    if (owned) {
      P(card.x + pxs * 2, card.y + pxs * 2, pxs * 2, pxs * 2, r.col);
      P(card.x + card.w - pxs * 4, card.y + pxs * 2, pxs * 2, pxs * 2, r.col);
    }

    const icx = card.x + u * 24, icy = card.y + card.h / 2;
    P(icx - u * 14, icy - u * 14, u * 28, u * 28, owned ? '#2a1b4a' : '#1a1229');
    statIcon(r.icon, icx, icy, u * 12, owned ? r.col : '#5f5583');

    arcTxt(r.name, card.x + u * 46, card.y + card.h * 0.32, u * 9,
      owned ? '#ffffff' : '#8f86b8', 'left', { shadow: pxs * 0.4, maxW: card.w - u * 100 });
    arcTxt(r.d, card.x + u * 46, card.y + card.h * 0.60, u * 8,
      owned ? r.col : '#5f5583', 'left', { shadow: pxs * 0.35, maxW: card.w - u * 100 });

    const tag = owned ? 'ЕСТЬ' : r.cost + ' ◆';
    arcTxt(tag, card.x + card.w - u * 12, card.y + card.h - u * 12, u * 9.5,
      owned ? '#3ddc84' : affordable ? '#9dffc4' : '#5f5583', 'right', { shadow: pxs * 0.4 });
  }

  /* ---- сводка бонусов ---- */
  const sy = C.y + u * 74 + 3 * (u * 58 + u * 8) + u * 12;
  const shh = Math.min(u * 138, C.y + C.h - sy - u * 6);
  if (shh > u * 50) {
    const own = Object.keys(G.relics || {}).length;

    arcTxt('БОНУСЫ РЕЛИКВИЙ', C.x + u * 16, sy + u * 20, u * 10, '#8f86b8', 'left', { shadow: pxs * 0.4 });
    arcTxt(own + ' / 6', C.x + C.w - u * 16, sy + u * 20, u * 10.5,
      own >= 6 ? '#3ddc84' : '#7cf3ff', 'right', { shadow: pxs * 0.4 });
    P(C.x + u * 14, sy + u * 32, C.w - u * 28, pxs, '#3d2f66');

    const rows = [
      ['УРОН В СЕК', '+' + Math.round(relicBonus('dps') * 100) + '%'],
      ['ЗОЛОТО',     '+' + Math.round(relicBonus('gold') * 100) + '%'],
      ['HP',         '+' + Math.round(relicBonus('hp') * 100) + '%'],
      ['КРИТ',       '+' + Math.round(relicBonus('crit') * 100) + '%'],
      ['ОТРЯД',      '+' + Math.round(relicBonus('ally') * 100) + '%'],
      ['ВСЁ',        '+' + Math.round(relicBonus('all') * 100) + '%']
    ];
    const colW = C.w / 3;
    rows.forEach((r, i) => {
      const cx2 = C.x + (i % 3) * colW + u * 16;
      const cy2 = sy + u * 50 + Math.floor(i / 3) * u * 36;
      arcTxt(r[0], cx2, cy2, u * 8.5, '#5f5583', 'left', { shadow: pxs * 0.3 });
      arcTxt(r[1], cx2, cy2 + u * 17, u * 12.5,
        r[1] === '+0%' ? '#3d2f66' : '#9dffc4', 'left', { shadow: pxs * 0.45 });
    });
  }
}

function drawUpgradeCards() {
  const u = U;
  const now = performance.now() / 1000;
  const pxs = Math.max(2, u * 2.2);
  for (const c of layout.cards) {
    const d = UP[c.key];
    const lv = G.up[c.key] || 0;
    const cst = cost(c.key);
    const afford = G.gold >= cst;

    /* карточка */
    arcPanel(c.x + pxs * 2, c.y + pxs * 2, c.w, c.h, '#08040f', null, u * 8);
    arcPanel(c.x, c.y, c.w, c.h, lv > 0 ? '#1c1330' : '#150e24', afford ? '#6a4fa8' : '#302450', u * 8);
    /* левая «полоса уровня» */
    P(c.x + pxs, c.y + pxs, pxs * 1.6, c.h - pxs * 2, lv > 0 ? '#ffd166' : '#3d2f66');

    /* иконка — квадратная плашка */
    const ir = c.h * 0.26;
    const icx = c.x + u * 30, icy = c.y + c.h / 2;
    P(icx - ir, icy - ir, ir * 2, ir * 2, afford ? '#2a1b4a' : '#1a1229');
    ctx.save();
    ctx.strokeStyle = afford ? '#7cf3ff' : '#3d2f66';
    ctx.lineWidth = Math.max(1.2, pxs * 0.7);
    ctx.strokeRect(Math.round(icx - ir), Math.round(icy - ir), Math.round(ir * 2), Math.round(ir * 2));
    ctx.restore();
    statIcon(d.icon, icx, icy, ir * 0.82, afford ? '#c8b6ff' : '#5f5583');

    /* имя / уровень / эффект */
    const nameX = c.x + u * 58;
    const cname = (CONTENT.upgrades && CONTENT.upgrades[c.key]) || d.name;
    arcTxt(cname, nameX, c.y + c.h * 0.30, u * 12, '#f0e8ff', 'left', { shadow: pxs * 0.5, maxW: c.w - u * 150 });
    arcTxt('LV ' + lv, nameX, c.y + c.h * 0.60, u * 9.5, lv > 0 ? '#ffd166' : '#6f6592', 'left', { shadow: pxs * 0.4 });
    arcTxt(effectText(c.key, lv), nameX, c.y + c.h * 0.82, u * 9, '#7cf3ff', 'left', { shadow: pxs * 0.4, maxW: c.w - u * 150 });

    /* кнопка покупки */
    const bwd = u * 80, bht = Math.min(u * 32, c.h * 0.48);
    const bxx = c.x + c.w - bwd - u * 10;
    const byy = c.y + c.h / 2 - bht / 2;
    if (afford) {
      arcPanel(bxx + pxs * 1.5, byy + pxs * 1.5, bwd, bht, '#0a3018', null, u * 5);
      arcPanel(bxx, byy, bwd, bht, '#3ddc84', '#b6ffd0', u * 5);
    } else {
      arcPanel(bxx, byy, bwd, bht, '#1a1229', '#3d2f66', u * 5);

/* ============================== INPUT ============================== */
function localXY(e) {
  const r = cv.getBoundingClientRect();
  let cx = 0, cy = 0;
  if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: cx - r.left, y: cy - r.top };
}

function inRect(p, r) {
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}
function inDisc(p, d) {
  return d && Math.hypot(p.x - d.x, p.y - d.y) <= d.r;
}

function onDown(e) {
  const p = localXY(e);
  Sfx.init();

  /* offline report blocks everything */
  if (offlineReport) {
    if (inRect(p, layout.offlineBtn)) {
      G.gold += offlineReport.gold;
      G.totalGold += offlineReport.gold;
      offlineReport = null;
      Sfx.coin(); HAP('win');
      save();
    }
    return;
  }

  if (state === 'menu') {
    if (inDisc(p, layout.soundBtn)) {
      G.sound = !G.sound; Sfx.on = G.sound; if (G.sound) Sfx.coin(); save(); return;
    }
    if (inRect(p, layout.playBtn)) {
      state = 'play'; G2.spawnT = 0.3; save();
      Sfx.win(); HAP('win');
      return;
    }
    return;
  }

  if (shopOpen) {
    /* close */
    if (inDisc(p, layout.closeBtn)) { shopOpen = false; save(); return; }    /* tabs */
    for (const tb of layout.tabs) {
      if (inRect(p, { x: tb.x, y: tb.y, w: tb.w, h: tb.h })) {
        tab = tb.id; layoutShop(); Sfx.tap ? Sfx.tap() : Sfx.hit(); return;
      }
    }
    if (tab === 'pr') {
      /* prestige */
      const pb = { x: layout.prBtn.x + layout.prBtn.w - U * 110, y: layout.prBtn.y + U * 14, w: U * 96, h: U * 32 };
      if (inRect(p, pb)) { doPrestige(); return; }
      /* auto buy */
      if (inRect(p, layout.buyAll)) { G.auto.buy = !G.auto.buy; Sfx.buy(); HAP('buy'); save(); return; }
      /* skins */
      for (const sc of layout.skinCards) {
        if (inRect(p, sc)) {
          if (G.skinsOwned.indexOf(sc.skin) < 0) { showMsg('СКИН ЗАКРЫТ'); Sfx.bad(); return; }
          G.skin = sc.skin; Sfx.buy(); HAP('buy'); save(); return;
        }
      }
      return;
    }
    if (tab === 'sk') {
      for (const sc of layout.skillCards) {
        if (inRect(p, sc)) { buySkill(sc.id); return; }
      }
      return;
    }
    if (tab === 'rel') {
      if (layout.dailyClaim && inRect(p, layout.dailyClaim)) {
        const d = claimDaily();
        if (d) showMsg('ДЕНЬ ' + ((G.daily.streak - 1) % 7 + 1) + ': ' + (d.what || ''));
        else { showMsg('ЕЩЁ НЕ ГОТОВО'); Sfx.bad(); }
        return;
      }
      for (const rc of layout.relicCards) {
        if (inRect(p, rc)) { buyRelic(rc.id); return; }
      }
      return;
    }
    /* upgrade cards */
    for (const c of layout.cards) {
      if (c._btn && inRect(p, c._btn)) { buy(c.key); return; }
      if (inRect(p, { x: c.x, y: c.y, w: c.w, h: c.h })) { buy(c.key); return; }
    }
    return;
  }

  /* shop button */
  if (inRect(p, shopButtonRect())) {
    shopOpen = true; shopT = 0; layoutShop(); Sfx.buy(); HAP('buy'); save(); return;
  }

  /* ultimate button */
  if (layout.ultBtn && inDisc(p, layout.ultBtn)) { useUlt(); return; }

  /* skill buttons */
  for (let i = 0; i < 4; i++) {
    const b = layout.skillBtns[i];
    if (b && inDisc(p, b)) { useSkill(SKORDER[i]); return; }
  }

  /* tap anywhere = attack */
  tapAttack(p.x, p.y);
}

/* shop open button (bottom-right small) */
function shopButtonRect() {
  const u = U;
  const w = u * 76, h = u * 34;
  return { x: W - u * 14 - w, y: H - u * 14 - h, w, h };
}

function drawShopButton() {
  const u = U;
  const r = shopButtonRect();
  const pulse = 0.86 + 0.14 * Math.sin(performance.now() / 320);
  ctx.save();
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = u * 12 * pulse;
  const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
  g.addColorStop(0, 'rgba(120,90,255,0.95)');
  g.addColorStop(1, 'rgba(78,50,200,0.97)');
  rr(r.x, r.y, r.w, r.h, r.h / 2, null);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  ctx.strokeStyle = hexA('#c8b6ff', 0.7); ctx.lineWidth = Math.max(1.2, u * 1.4);
  rr(r.x, r.y, r.w, r.h, r.h / 2, null); ctx.stroke();

  /* bag icon */
  const bx = r.x + u * 15, by = r.y + r.h / 2;
  ctx.fillStyle = '#ffe9a8';
  rr(bx - u * 6, by - u * 4, u * 12, u * 9, u * 2.5, '#ffe9a8');
  ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = Math.max(1, u * 1.2);
  ctx.beginPath(); ctx.arc(bx, by - u * 4, u * 3.4, Math.PI, 0); ctx.stroke();
  txt('МАГАЗИН', r.x + r.w * 0.60, by, u * 8.5, '#fff', 'center', '900');
}

/* ============================== FX DRAW ============================== */
function drawParticles() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    const r = p.r * (0.4 + a * 0.6);
    ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
  }
  ctx.globalAlpha = 1;
}
function drawCoins() {
  const u = U;
  for (const c of coins) {
    const a = clamp(c.life / 1.2, 0, 1);
    ctx.globalAlpha = a;
    disc(c.x, c.y, c.r, '#ffd166');
    disc(c.x - c.r * 0.25, c.y - c.r * 0.3, c.r * 0.35, 'rgba(255,255,255,0.7)');
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  for (const f of floats) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = U * 4;
    txt(f.s, f.x, f.y, f.size, f.col, 'center', '900');
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawRings() {
  for (const r of rings) {
    const a = clamp(r.life / r.max, 0, 1);
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = Math.max(1.5, U * 4 * a);
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawSkillFx() {
  const u = U;
  for (const f of skillFx) {
    const t = 1 - clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    if (f.type === 'strike') {
      const len = u * 240 * t;
      const g = ctx.createLinearGradient(f.x, f.y, f.x + len, f.y);
      g.addColorStop(0, hexA(f.col, 0.95));
      g.addColorStop(1, hexA(f.col, 0));
      ctx.fillStyle = g;
      ctx.fillRect(f.x, f.y - u * 7 * (1 - t * 0.5), len, u * 14 * (1 - t * 0.5));
    } else if (f.type === 'tornado') {
      ctx.strokeStyle = f.col; ctx.lineWidth = u * 4;
      for (let i = 0; i < 4; i++) {
        const rr2 = u * (16 + i * 12) * (1 + t);
        ctx.beginPath();
        ctx.ellipse(f.x, f.y - u * 40 - i * u * 16, rr2, rr2 * 0.3, 0, 0, TAU);
        ctx.stroke();
      }
    } else if (f.type === 'meteor') {
      if (t < 0.55) {
        const tt = t / 0.55;
        const my = lerp(-u * 80, f.y - u * 20, tt);
        const mx = lerp(f.x + u * 180, f.x, tt);
        glowDisc(mx, my, u * 16, f.col, u * 30);
        ctx.strokeStyle = hexA(f.col, 0.5); ctx.lineWidth = u * 10;
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + u * 90, my - u * 80); ctx.stroke();
      }
    } else if (f.type === 'heal') {
      for (let i = 0; i < 5; i++) {
        const yy = f.y + u * 30 - t * u * 90 - i * u * 14;
        ctx.fillStyle = hexA(f.col, 0.9 * (1 - t));
        disc(f.x + Math.sin(t * 8 + i) * u * 14, yy, u * 4 * (1 - t * 0.5), hexA(f.col, 0.9 * (1 - t)));
      }
    }
    ctx.globalAlpha = 1;
  }
}

function drawAchToast() {
  if (!achMsg) return;
  const u = U;
  const t = clamp(achT / 2.6, 0, 1);
  const inA = clamp((1 - t) * 6, 0, 1);
  const outA = clamp(t * 6, 0, 1);
  const a = Math.min(inA, outA);
  const w = Math.min(W * 0.78, u * 360);
  const h = u * 54;
  const x = (W - w) / 2;
  const y = u * 86 - (1 - a) * u * 30;

  ctx.globalAlpha = a;
  ctx.save();
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = u * 20;
  rr(x, y, w, h, u * 14, 'rgba(28,20,10,0.96)');
  ctx.restore();
  ctx.strokeStyle = hexA('#ffd166', 0.8); ctx.lineWidth = Math.max(1.4, u * 1.6);
  rr(x, y, w, h, u * 14, null); ctx.stroke();

  statIcon('cdmg', x + u * 28, y + h / 2, u * 15, '#ffd166');
  txt('ДОСТИЖЕНИЕ', x + u * 52, y + u * 18, u * 9, hexA('#ffd166', 0.85), 'left', '800');
  txt(achMsg.name || '', x + u * 52, y + u * 33, u * 13, '#fff8e0', 'left', '900', w - u * 66);
  txt(achMsg.d || '', x + u * 52, y + u * 45, u * 8.5, 'rgba(255,240,200,0.6)', 'left', '600', w - u * 66);
  ctx.globalAlpha = 1;
}

/* ============================== MAIN RENDER ============================== */
const camShake = () => ({ x: rand(-1, 1) * G2.shake, y: rand(-1, 1) * G2.shake });

/* ============================== FX LAYERS ============================== */
function groundShadow(x, w, a) {
  const g = ctx.createRadialGradient(x, groundY + U * 3, 0, x, groundY + U * 3, w);
  g.addColorStop(0, 'rgba(0,0,0,' + a + ')');
  g.addColorStop(0.65, 'rgba(0,0,0,' + a * 0.45 + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.translate(x, groundY + U * 3);
  ctx.scale(1, 0.20);
  ctx.beginPath(); ctx.arc(0, 0, w, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}

function heroAura(t) {
  const zd = zoneDef(G.zone);
  const pulse = 0.6 + 0.4 * Math.sin(t * 2.2);
  const g = ctx.createRadialGradient(heroX, groundY - U * 46, U * 6, heroX, groundY - U * 46, U * 92);
  g.addColorStop(0, hexA(zd.accent, 0.16 * pulse));
  g.addColorStop(0.45, hexA(zd.accent, 0.06 * pulse));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(heroX - U * 100, groundY - U * 150, U * 200, U * 200);
  /* floor ring */
  ctx.save();
  ctx.translate(heroX, groundY + U * 2);
  ctx.scale(1, 0.2);
  ctx.strokeStyle = hexA(zd.accent, 0.22 + 0.14 * pulse);
  ctx.lineWidth = Math.max(1, U * 2.2);
  ctx.beginPath(); ctx.arc(0, 0, U * 52, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.52, Math.min(W, H) * 0.34, W / 2, H * 0.52, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.46)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawComboBloom(t) {
  if (G2.combo < 5) return;
  const k = clamp((G2.combo - 5) / 45, 0, 1);
  const a = k * clamp(G2.comboT / 1.4, 0, 1);
  const col = G2.combo >= 20 ? '#ff8af0' : '#7cf3ff';
  const g = ctx.createRadialGradient(heroX, groundY - U * 50, U * 20, heroX, groundY - U * 50, U * (110 + k * 70));
  g.addColorStop(0, hexA(col, 0.12 * a));
  g.addColorStop(0.6, hexA(col, 0.05 * a));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawUltFx(t) {
  if (G2.ultFx <= 0) return;
  const p = 1 - G2.ultFx;          /* 0..1 progress */
  const a = G2.ultFx;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* expanding shockwave rings */
  for (let i = 0; i < 3; i++) {
    const r = U * (60 + p * 420 + i * 90);
    ctx.strokeStyle = hexA(i % 2 ? '#ff6ad5' : '#7cf3ff', a * (0.5 - i * 0.12));
    ctx.lineWidth = Math.max(1.5, U * (7 - i * 1.8) * a);
    ctx.beginPath(); ctx.arc(heroX, groundY - U * 46, r, 0, TAU); ctx.stroke();
  }
  /* vertical beam */
  const bw2 = U * 26 * a;
  const bg = ctx.createLinearGradient(heroX - bw2, 0, heroX + bw2, 0);
  bg.addColorStop(0, hexA('#ff6ad5', 0));
  bg.addColorStop(0.5, hexA('#ffffff', 0.5 * a));
  bg.addColorStop(1, hexA('#ff6ad5', 0));
  ctx.fillStyle = bg;
  ctx.fillRect(heroX - bw2, 0, bw2 * 2, groundY + U * 10);
  ctx.restore();
}

function render() {
  const u = U;
  const t = performance.now() / 1000;

  if (state === 'menu') {
    for (let i = stars.length - 1; i >= 0; i--) { stars[i].ph += 0.02; }
    drawSky(0);
    drawFar(0);
    drawGround(0);
    drawMenu();
    drawParticles();
    if (offlineReport) drawOffline();
    return;
  }

  /* camera shake */
  const sh = camShake();
  ctx.save();
  ctx.translate(sh.x, sh.y);

  drawSky(G2.zoneIn);
  drawFar(G2.zoneIn);
  drawGround(G2.zoneIn);

  /* atmospheric haze between ground and actors */
  const hz = ctx.createLinearGradient(0, groundY - worldH * 0.30, 0, groundY + U * 26);
  hz.addColorStop(0, hexA(zoneDef(G.zone).accent, 0));
  hz.addColorStop(0.75, hexA(zoneDef(G.zone).accent, 0.055));
  hz.addColorStop(1, hexA(zoneDef(G.zone).accent, 0));
  ctx.fillStyle = hz;
  ctx.fillRect(0, groundY - worldH * 0.30, W, worldH * 0.30 + U * 26);

  /* hero aura + shadow */
  heroAura(t);
  groundShadow(heroX, U * 54, 0.42);

  /* hero */
  const heroSt = G2.dead > 0 ? 'dead' : G2.atkAnim > 0.3 ? 'attack' : 'idle';
  const heroPh = t;
  if (G2.dead > 0) {
    ctx.save();
    ctx.globalAlpha = 1 - G2.dead * 0.7;
    drawHero(heroX, groundY, heroPh, 'idle');
    ctx.restore();
  } else {
    drawHero(heroX, groundY, heroPh, heroSt);
  }

  /* monster */
  if (G2.monster) {
    const m = G2.monster;
    const lunge = m.lunge > 0 ? Math.sin(m.lunge * Math.PI) * U * 18 : 0;
    groundShadow(m.x - lunge, m.mh * 0.55, m.boss ? 0.5 : 0.36);
    drawMonster(m, m.x - lunge, groundY, m.mh);
  }

  /* ultimate shockwave */
  drawUltFx(t);
  drawComboBloom(t);

  /* typing: hero run animation trail */
  if (G2.atkAnim > 0) {
    ctx.globalAlpha = G2.atkAnim * 0.35;
    ctx.strokeStyle = '#7cf3ff';
    ctx.lineWidth = u * 3;
    ctx.beginPath();
    ctx.arc(heroX, groundY - u * 46, u * 42, -0.9, 0.9);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  drawSkillFx();
  drawParticles();
  drawCoins();
  drawRings();
  drawFloats();

  ctx.restore();

  /* vignette over the world */
  drawVignette();

  /* hud */
  drawHUD();
  drawShopButton();

  /* boss intro banner */
  if (G2.bossIntro > 0 && G2.monster) {
    const a = clamp(G2.bossIntro, 0, 1);
    const m = G2.monster;
    ctx.save();
    ctx.globalAlpha = a;
    const by = H * 0.30;
    const bw = Math.min(W * 0.86, u * 460);
    rr(W / 2 - bw / 2, by - u * 20, bw, u * 58, u * 8, 'rgba(10,4,20,0.72)');
    ctx.strokeStyle = hexA('#ff4d5e', 0.8); ctx.lineWidth = Math.max(1.5, u * 2);
    rr(W / 2 - bw / 2, by - u * 20, bw, u * 58, u * 8, null); ctx.stroke();
    txt('БОСС', W / 2, by - u * 6, u * 10, hexA('#ff4d5e', 0.9), 'center', '800');
    txt(m.name || 'БОСС', W / 2, by + u * 11, u * 16, '#ffe0e4', 'center', '900', bw - u * 20);
    txt(FLAV.taunt[G.zone % FLAV.taunt.length], W / 2, by + u * 30, u * 9,
      hexA('#ffb3ba', 0.72 * a), 'center', '600', bw - u * 20);
    ctx.restore();
  }

  /* zone transition flash */
  if (G2.zoneIn > 0) {
    ctx.globalAlpha = clamp(G2.zoneIn, 0, 1) * 0.45;
    ctx.fillStyle = zoneDef(G.zone).accent;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    const zd = zoneDef(G.zone);
    const zname = (CONTENT.zones && CONTENT.zones[zoneKey()]) || zd.name;
    ctx.globalAlpha = clamp(G2.zoneIn, 0, 1);
    txt('ЗОНА ' + G.zone, W / 2, H * 0.42, u * 14, 'rgba(255,255,255,0.75)', 'center', '700');
    txt(zname, W / 2, H * 0.5, u * 30, '#fff', 'center', '900', W * 0.9);
    ctx.globalAlpha = 1;
  }

  /* hurt vignette */
  if (G2.hurt > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,0,40,0)');
    g.addColorStop(1, 'rgba(255,0,40,' + (G2.hurt * 0.42) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  drawAchToast();
  drawShop();

  /* offline report */
  if (offlineReport) drawOffline();
}

function drawOffline() {
  const u = U;
  const r = offlineReport;
  ctx.fillStyle = 'rgba(2,1,6,0.86)';
  ctx.fillRect(0, 0, W, H);
  const w = Math.min(W * 0.84, u * 340);
  const h = u * 232;
  const x = (W - w) / 2, y = (H - h) / 2;
  rr(x, y, w, h, u * 20, 'rgba(20,14,40,0.98)');
  ctx.strokeStyle = hexA('#7c5cff', 0.5); ctx.lineWidth = Math.max(1.4, u * 1.6);
  rr(x, y, w, h, u * 20, null); ctx.stroke();

  txt('ПОКА ВАС НЕ БЫЛО', x + w / 2, y + u * 32, u * 15, '#e8ddff', 'center', '900');
  const mins = Math.floor(r.sec / 60);
  txt('Отсутствовали: ' + (mins >= 60 ? Math.floor(mins / 60) + ' ч ' + (mins % 60) + ' м' : mins + ' мин'),
    x + w / 2, y + u * 58, u * 11, 'rgba(200,195,240,0.65)', 'center', '600');

  disc(x + w / 2, y + u * 112, u * 26, 'rgba(255,209,102,0.12)');
  disc(x + w / 2, y + u * 112, u * 17, '#ffd166');
  txt('$', x + w / 2, y + u * 112, u * 22, 'rgba(70,40,0,0.9)', 'center', '900');
  txt('+' + fmt(r.gold), x + w / 2, y + u * 152, u * 22, '#ffe9a8', 'center', '900');

  const bw = w - u * 56, bh = u * 38;
  const bx = x + u * 28, by = y + h - bh - u * 20;
  layout.offlineBtn = { x: bx, y: by, w: bw, h: bh };
  rr(bx, by, bw, bh, bh / 2, '#7c5cff');
  txt('ЗАБРАТЬ', x + w / 2, by + bh / 2, u * 14, '#fff', 'center', '900');
}

/* ============================== LOOP ============================== */
let lastT = performance.now();
let saveT = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  tipT -= dt;
  update(dt);

  saveT += dt;
  if (saveT > 8) { saveT = 0; save(); }

  render();
  requestAnimationFrame(frame);
}

/* ============================== OFFLINE ============================== */
function checkOffline() {
  const away = (Date.now() - (G.lastSeen || Date.now())) / 1000;
  if (away < 60) return;
  const capped = Math.min(away, 8 * 3600);
  const st = stats();
  const gold = Math.floor(st.dps * capped * 0.28 * st.goldM * 0.35);
  if (gold > 0 && G.kills > 0) {
    offlineReport = { sec: capped, gold };
  }
}

/* ============================== ACH SYNC ============================== */
function syncAch() {
  /* achievements tied to content names */
  if (CONTENT.ach && CONTENT.ach.length) {
    for (let i = 0; i < ACH.length && i < CONTENT.ach.length; i++) {
      const c = CONTENT.ach[i];
      if (c && c.name) { ACH[i].name = c.name; ACH[i].d = c.d || ACH[i].d; }
    }
  }
}

/* ============================== BOOT ============================== */
function initStars() {
  stars = [];
  const n = Math.round(Math.min(180, W * 0.22));
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() < 0.86 ? 1 : 2,
      a: rand(0.25, 0.95),
      sp: rand(0.4, 2.4),
      ph: rand(0, TAU),
      c: Math.random() < 0.2 ? '#aee0ff' : '#ffffff'
    });
  }
}

function boot() {
  resize();
  window.addEventListener('resize', () => { resize(); initStars(); layoutShop(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { resize(); initStars(); layoutShop(); }, 220));

  initStars();
  load();
  Sfx.on = G.sound;
  syncAch();
  layoutShop();

  const st = stats();
  G2.maxHP = st.maxHP;
  G2.hp = st.maxHP;

  checkOffline();

  /* telegram */
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor('#08040f');
      if (TG.setBackgroundColor) TG.setBackgroundColor('#08040f');
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      if (TG.enableClosingConfirmation) TG.enableClosingConfirmation();
    } catch (e) {}
  }

  state = 'menu';

  if (location.search.indexOf('dbg') >= 0) {
    window.__G = G; window.__G2 = G2; window.__st = stats;
    window.__lay = () => layout; window.__tab = () => tab;
    window.__dbg = () => ({ state, shopOpen, tab, shopT });
    window.__shopRect = shopButtonRect;
    window.__set = (k, v) => { G[k] = v; };
    window.__offline = (sec) => {
      G.lastSeen = Date.now() - sec * 1000;
      checkOffline();
      return offlineReport;
    };
  }

  cv.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
  cv.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  cv.addEventListener('mousedown', onDown);

  requestAnimationFrame(frame);
}

boot();

})();
</script>
